 # Nordic Honor bookmark
 bm_867_nh_nordic_honor:0 "Nordic Honor"
 bm_867_nh_nordic_honor_desc:0 "日耳曼信仰远没有基督教编年史家所宣称的那般统一。日耳曼异教自古便兼容并蓄、崇奉多神，根植于遥远的过去，也有着众多不同的形态。\n\n大多数信徒追随#bold Æsirtrú#!，即崇奉阿萨神族的信仰。对他们中的许多人而言，瓦尔哈拉便是最高的追求——这座荣耀的殿堂，首先向那些在战斗中光荣倒下的人敞开大门。\n\n在遥远的北方，与萨米人领地接壤的地方，逐渐形成了更为和平、亲近自然的#bold Landvættir#!。而在斯拉夫人的土地上，#bold Erþtrú#!则使一种受斯拉夫传统影响的日耳曼信仰重获新生。\n\n然而，面对日益强盛的基督教，斗争依然残酷无情。\n\n维京领主们会坚守祖先的信仰吗？他们会将古老的传统凝聚为统一的宗教，还是终将接受基督徒的信仰与生活方式？\n\n#bold 世界是否将迎来新的诸神黄昏，旧神与新神之间最后的决战？又或者，为了维护和平，连基督徒的上帝也会在北方诸神之间找到自己的位置？#!"
 nh_bookmark_ivar:0 "无骨者伊瓦尔"
 nh_bookmark_ivar_desc:0 "拉格纳国王死了！\n\n他像一个蒙羞的俘虏，被扔进了满是毒蛇的深坑。基督徒以为，这样便能夺走他战死沙场的荣耀，以及他在瓦尔哈拉的位置。但奥丁绝不会让拉格纳这样的人沦落到赫尔冥界！\n\n基督徒必须为这桩耻辱付出代价。拉格纳之死一日未得报偿，就绝不可能有和平！\n\n唯有当整个英格兰化为灰烬，祭司被献祭给诸神，圣典被投入烈火，我们才会罢休。\n\n#bold 不施怜悯！不予宽恕！奥丁意欲如此！#!"
 nh_bookmark_ivar_subheading:0 "北境复仇者"
 nh_bookmark_dyre:0 "基辅的迪雷"
 nh_bookmark_dyre_desc:0 "远离斯堪的纳维亚的峡湾，迪雷将命运握在了自己手中。这位诺斯冒险家沿着东方的河流一路前行，最终来到基辅，在这里建立了自己的统治。\n\n在这里，北方的诸神与斯拉夫人的古老习俗交汇。迪雷明白，统治者需要的不只是一把利剑和奥丁的祝福。黄金、盟约，以及臣民的忠诚，同样珍贵。\n\n在这片异乡，迪雷看到的不只是战利品，更是未来。他不愿忘记自己的诺斯根源，但又何必鄙弃如今受他统治之人的习俗与神明？\n\n迪雷能否在东方巩固诺斯传统，将其与斯拉夫习俗融合，开创一个新的国度？还是说，他的名字也会像无数冒险家那样，消失在历史的迷雾中？"
 nh_bookmark_dyre_subheading:0 "异乡之主"
 nh_bookmark_olafr:0 "白色奥拉夫"
 nh_bookmark_olafr_desc:0 "白色奥拉夫曾统治着都柏林的北方人。他的舰船将战争与恐惧带到爱尔兰和苏格兰的海岸，他的名号也传遍了爱尔兰海以外的广大地区。\n\n然而，仅有荣耀并不足以留下传承。奥拉夫告别了从前的家园，与忠诚的追随者一同驶向新的彼岸。如今，他在布列塔尼海岸积蓄力量，准备再一次亲手把握自己的命运。\n\n世界辽阔无垠，地平线的另一边有肥沃的土地、富庶的城市，还有那些尚未因他的到来而心生恐惧的君主与王国。\n\n#bold 奥拉夫会追随先祖的足迹，满足于战利品和荣耀吗？还是会建立一个新的王国，让祖先的习俗与神明世世代代受到尊崇？#!"
 nh_bookmark_olafr_subheading:0 "驶向新的彼岸"
 nh_bookmark_rollo:0 "罗洛"
 nh_bookmark_rollo_desc:0 "身处北方的故乡丹麦，罗洛感受到了远方的召唤。富裕修道院、异域王国与荣耀之战的传闻，激起了他的冒险之心。既然海的另一边有名望与财富，等待足够勇敢的人前去夺取，他又何必留在故乡？\n\n法兰克人的富饶土地尤其意味着丰厚的战利品。他们的国王为权力和影响力争斗不休，而王国的河流与海岸则向诺斯长船敞开着。若能带上一群忠诚的战士，罗洛便可以去那里碰碰运气，闯出自己的名号。\n\n但大海彼岸的世界并不只有金银。异域的风俗、强大的君主，以及对被钉在十字架上的神的信仰，都可能以他意想不到的方式改变命运。\n\n#bold 罗洛会作为令人畏惧的维京人，赢得荣耀与财富吗？他会在奥丁的庇护下寻得新的家园吗？还是会在某一天接受十字架，奠定一份连他自己都尚未预料到其意义的传承？#!"
 nh_bookmark_rollo_subheading:0 "锤与十字之间"
 nh_bookmark_audr:0 "深谋者奥德"
 nh_bookmark_audr_desc:0 "在这个国王以刀剑解决争端、战士追逐荣耀与财富的世界里，深谋者奥德决意走出自己的道路。\n\n她在北方传统与基督教世界的异域习俗之间长大，既明白信仰的力量，也深知世俗权势转瞬即逝。然而，在旧神仍眷顾信徒命运之时，对被钉上十字架的神的信仰正势不可挡地蔓延。\n\n遥远的北大西洋上，有一座由火与冰塑造的神秘岛屿，连大地本身都仿佛在呼吸。人们传说，那里有隐秘的力量、古老的精灵，还有从未臣服于任何国王的土地。那会不会正是旧神许诺给信徒的新家园？\n\n但也许，她的人民的未来并不在与世隔绝的冰岛，而在于接受基督教，与西方各族和平共处。\n\n#bold 奥德会追随旧神的召唤，在他们的庇护下于冰岛建立新的家园吗？还是会接受十字架，带领诺斯同胞走向一个新时代？#!"
 nh_bookmark_audr_subheading:0 "冰火女领主"
 nh_bookmark_sverker:0 "翁厄曼兰的斯韦克尔"
 nh_bookmark_sverker_desc:0 "在遥远的北方，茂密的森林、幽深的湖泊和古老的圣地遍布大地，Landvættir的信徒坚守着世代相传的信仰。他们敬奉旧神与自然精灵，后者已守护这片家园无数代之久。\n\n然而，时代正在改变。Æsirtrú的强大统治者蔑视着这些亲近自然的同信仰兄弟，而邻近的乌戈教信徒也对他们心存疑虑。\n\n也许，他的人民的未来不在战场，而在信仰本身。随着基督教不断扩张，将其教诲与古老传统结合，或许能开辟一条和平共存的新道路。\n\n#bold 古老的精灵与圣地能否免受强大邻国的影响？基督的教诲与旧神的智慧能否融为一种新的信仰？还是说，Landvættir最后的避难所终将毁于战火？#!"
 nh_bookmark_sverker_subheading:0 "林中精灵的守护者"
 nh_bookmark_haraldr:0 "乱发哈拉尔"
 nh_bookmark_haraldr_desc:0 "挪威是一片分裂的土地。无数酋长与小国王统治着这里的峡湾、谷地和群山。世仇与旧日的竞争左右着居民的命运，至今无人能将整个国家统一在一顶王冠之下。\n\n但哈拉尔立下了一个非凡的誓言。骄傲的居达拒绝了他的求婚，声称只会嫁给统治全挪威的男人。于是，他下定了一个影响深远的决心：在整个国家臣服于自己的统治之前，剪刀和梳子都不得触碰他的头发。\n\n自此，他便被称为乱发。旁人眼中或许只是愚蠢的夸口，对哈拉尔而言却是神圣的誓言，他决心在诸神和先祖面前将其兑现。\n\n然而，挪威诸王绝不会不战而放弃自由。任何胆敢争夺整个国家统治权的人，都将面对血腥的战斗、脆弱的盟约与背叛。\n\n#bold 哈拉尔能否实现誓言，将挪威统一在一顶王冠之下，并以美发之名载入史册？还是说，他失控的野心终将把自己和整个家族引向覆灭？#!"
 nh_bookmark_haraldr_subheading:0 "挪威需要一位国王"

