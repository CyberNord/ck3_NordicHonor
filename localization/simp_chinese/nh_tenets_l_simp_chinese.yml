l_simp_chinese:
 nh_tenet_vighugr_name:0 "Víghugr"
 nh_tenet_vighugr_desc:0 "宗教热忱与战斗意志激励着将战争视为神圣义务的人。他们信仰坚定，作战无畏，渴望在瓦尔哈拉占有一席之地。"
 doctrine_parameter_nh_holy_raid_allowed:0 "当前仪式将Víghugr作为核心教义时，允许发动宗教劫掠战争。"
 doctrine_parameter_nh_forced_conversion_allowed:0 "当前仪式将Víghugr作为核心教义时，允许使用强制改信。"
 doctrine_parameter_nh_elite_warriors_allowed:0 "当前仪式将Víghugr作为核心教义时，允许使用“$nh_odinstru_raise_elite_warriors$”决议。"
 doctrine_parameter_nh_vighugr_foreign_conversion_bonus:0 "统治者的内阁对非日耳曼宗教伯爵领的改信速度+30%。"
 doctrine_parameter_nh_odins_call_available:0 "解锁一生仅能完成一次的“响应奥丁的召唤”决议。"
 nh_follow_odins_call_decision:0 "响应奥丁的召唤"
 nh_follow_odins_call_decision_desc:0 "一只渡鸦已经跟随我数日。无论我在哪里歇息，黑鸟总会落在附近。它的目光令我不安，远比我愿意承认的更甚。即使祈祷时，思绪也会回到它身上。我第一次开始怀疑，祖辈的信仰是否也真正属于我。"
 nh_follow_odins_call_decision_tooltip:0 "循着黑鸟的踪迹前行。"
 nh_follow_odins_call_decision_confirm:0 "聆听召唤"
 nh_follow_odins_call_unavailable:0 "此时此地，我无法响应奥丁的召唤。"
 nh_follow_odins_call_blessing_desc:0 "诸神的名字早已熟稔于唇边。然而近来，即使祈祷也无法平息纷乱的思绪。有些话始终未能说出口，有些决定沉沉压在胸口。\n\n一只渡鸦栖在林缘。与它的目光相遇时，我想起那位年老的旅者，也想起那些连顾问们都无法看透的事情。"
 nh_odins_call.0001.t:0 "窗前的渡鸦"
 nh_odins_call.0001.desc:0 "渡鸦又停在窗前。这一次，我没有赶走它。推开窗板，冷风拂过双手。黑鸟几乎一动不动，仿佛一直在等我。\n\n熟悉的晚祷词在唇边变得断断续续。这些话自幼便已熟记，可今晚却无法带来慰藉。昨夜的梦反而浮现眼前：宽广的殿堂、遥远的声音，以及脸庞半掩在阴影中的旅者。\n\n为何祈祷中求而不得的宁静，竟出现在这陌生的幻象里？"
 nh_odins_call.0001.convert:0 "Óðinn，请聆听我的誓言。我将追随你。"
 nh_odins_call.0001.refuse:0 "我绝不会向这些偶像屈膝！"
 nh_odins_call.not_now:0 "现在还不是时候……"
 nh_odins_call.0002.t:0 "众神之父的注视"
 nh_odins_call.0002.desc:0 "来到圣林边缘，同伴们都安静下来。枝叶间掠过黑影，两只渡鸦盘旋在祭坛上方。我将手掌贴在老树粗糙的树皮上。\n\n许久，我说不出话。听过的声音太多，怀疑自己的判断也太频繁。此刻站在枝叶下，关于旅者的古老故事又回到了心间。\n\n终于，我垂下头。那些想向众神之父倾诉的话，在同伴面前始终难以启齿。"
 nh_odins_call.0002.bless:0 "众神之父，请赐我一份你的智慧。"
 nh_odins_call.0003.t:0 "陌生星空下的誓言"
 nh_odins_call.0003.desc:0 "我向寒冷的夜色宣誓。刹那间，仿佛连风也停下了。随后，渡鸦张开双翼，消失在群星之间。\n\n新的祷词仍显生疏。我低声反复念着，直到声音逐渐坚定。Óðinn。当我不再犹豫地呼唤时，这个名字听起来已与从前不同。\n\n关上窗，不安并未完全消散。但我知道自己的誓言献给了谁。"
 nh_odins_call.0003.accept:0 "誓言已立，我的道路属于诸神。"
 nh_odins_call.0004.t:0 "独眼之神的恩赐"
 nh_odins_call.0004.desc:0 "最后的祭火熄灭时，一种陌生的宁静降临心间。原本纠缠不清的事情逐渐显出联系：一句随口的话、一段长久的沉默、一个被我过早否定的建议。\n\n回去的路上，我很少开口。林间风声轻响，头顶某处传来渡鸦的回应。我空手走出圣林，却觉得带着来时尚未拥有的某样东西。"
 nh_odins_call.0004.accept:0 "愿智慧为我指路，愿荣誉长存。"
 nh_odins_call.0005.t:0 "信仰坚定如初"
 nh_odins_call.0005.desc:0 "我迎着黑鸟的目光，念出自己信仰中熟悉的祷词。这一次，声音没有动摇。渡鸦偏了偏头，随后振翅飞起，翅声逐渐隐没在暮色里。\n\n我仍在敞开的窗边站了一会儿。那些夜里的疑问并没有自行消失，但我终于直面它们，而不再只是将它们推开。\n\n重新祈祷时，我更清楚自己为何要念出这些话。"
 nh_odins_call.0005.accept:0 "我知道自己的道路。"
