 norse_pagan_adherent:0 "Æsirtrú信徒"
 norse_pagan_adherent_plural:0 "Æsirtrú信徒"
 norse_pagan_desc:0 "Æsirtrú汇集了Ásatrú、Gíñnregla与Óðinnstrú的北方传统。各礼仪以不同方式敬奉共同的诸神。"
 norse_pagan_old:0 "古老的Æsirtrú"
 norse_pagan_old_adj:0 "古老的Æsirtrú"
 norse_pagan_old_adherent:0 "古老的Æsirtrú信徒"
 norse_pagan_old_adherent_plural:0 "古老的Æsirtrú信徒"
 nh_rite_heidinn_pagan:0 "Heiðinn"
 nh_rite_heidinn_pagan_adj:0 "heiðinn"
 nh_rite_heidinn_pagan_adherent:0 "Heiðinn"
 nh_rite_heidinn_pagan_adherent_plural:0 "Heiðnir"
 nh_rite_heidinn_pagan_desc:0 "The Skando-Slavic pantheon of Heiðinn has, in a way, adapted to the rugged customs of the Slavic peoples. It venerates the Norse gods with a blend of Norse and Slavic traditions. Followers of this belief value their connection to nature and practice rituals that encompass both the wild elements of Norse mythology and the natural cycles of Slavic traditions. They see the Norse gods as powerful protectors and seek their favor in matters of fertility, harvest, and survival in the harsh Slavic regions. The Kiever version of Asatru thus retains its Norse essence but integrates elements of Slavic culture and customs to form a unique community of faith."
 nh_rite_heidinn_pagan_old:0 "Old Heiðinn"
 nh_rite_heidinn_pagan_old_adj:0 "Old heiðinn"
 nh_rite_heidinn_pagan_old_adherent:0 "Old Heiðnir"
 nh_rite_heidinn_pagan_old_adherent_plural:0 "Old Heiðnir"
 nh_rite_forn_sidr_pagan:0 "Forn Siðr"
 nh_rite_forn_sidr_pagan_adj:0 "Forn Siðr"
 nh_rite_forn_sidr_pagan_adherent:0 "Forn Siðrist"
 nh_rite_forn_sidr_pagan_adherent_plural:0 "Forn Siðrists"
 nh_rite_forn_sidr_pagan_desc:0 "The ancient Germanic pantheon of Forn Siðr was characterized by a close connection to nature and a deep reverence for the natural elements. They worshipped Wotan, the Allfather, as the supreme deity and believed in the existence of a multitude of divine beings who influenced the world around them. The heathens practiced rituals and ceremonies to establish a spiritual connection with their gods, offering sacrifices and seeking support and blessings in all aspects of life. Their beliefs also encompassed a belief in fate and a strong bond with their ancestors. Overall, the pagan faith of the Saxons in northern Germany embodied a profound connection to nature, a strong sense of community, and a belief in the power and wisdom of their gods."
 nh_rite_forn_sidr_pagan_old:0 "Old Forn Siðr"
 nh_rite_forn_sidr_pagan_old_adj:0 "Old Forn Siðr"
 nh_rite_forn_sidr_pagan_old_adherent:0 "Old Forn Siðrar"
 nh_rite_forn_sidr_pagan_old_adherent_plural:0 "Old Forn Siðrar"
 nh_rite_natturugudtruar_pagan:0 "Náttúruguðtrúar"
 nh_rite_natturugudtruar_pagan_adj:0 "Náttúruguðtrúar"
 nh_rite_natturugudtruar_pagan_adherent:0 "Náttúruguðtrúarmaður"
 nh_rite_natturugudtruar_pagan_adherent_plural:0 "Náttúruguðtrúarmenn"
 nh_rite_natturugudtruar_pagan_desc:0 "The nature-oriented expression known as Náttúruguðtrúarmenn, which has blended with some elements of Finno-Ugric customs, embodies a deeply rooted connection to the natural world and witchcraft. This belief system honors the Norse gods and combines them with the traditional practices of the Finno-Ugric peoples. Through the application of witchcraft and shamanistic practices, the followers of this belief seek spiritual insight and harmony with the natural forces. They find inspiration in the spirits of forests, rivers, and mountains and celebrate rituals to strengthen their connection to nature. With deep respect for the diversity of nature and the interplay of elements, they strive for a balanced and harmonious existence in alignment with the Divine and nature spirits."
 nh_rite_natturugudtruar_pagan_old:0 "Old Náttúruguðtrúar"
 nh_rite_natturugudtruar_pagan_old_adj:0 "Old Náttúruguðtrúar"
 nh_rite_natturugudtruar_pagan_old_adherent:0 "Old Náttúruguðtrúarmaður"
 nh_rite_natturugudtruar_pagan_old_adherent_plural:0 "Old Náttúruguðtrúarmenn"

# Extinct pre-Christian Gothic rite of Erþtrú; no historical start followers.
 gothic_pagan:0 "哥特"
 gothic_pagan_adj:0 "哥特"
 gothic_pagan_adherent:0 "哥特异教徒"
 gothic_pagan_adherent_plural:0 "哥特异教徒"
 gothic_pagan_desc:0 "这一基督教传入前的哥特传统属于Erþtrú，结合了战士的坚定、献祭节庆与祖先崇拜。历史上的哥特人早在867年之前就已放弃旧有信仰；这一消亡的礼仪代表一次有意构想的另类历史复兴。"
