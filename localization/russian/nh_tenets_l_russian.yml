l_russian:
 nh_tenet_vighugr_name:0 "Víghugr"
 nh_tenet_vighugr_desc:0 "Религиозное рвение и готовность к бою воодушевляют тех, кто считает войну священным долгом. Стойкие в вере и бесстрашные в битве, они стремятся занять место в Вальхёлле."
 doctrine_parameter_nh_holy_raid_allowed:0 "Разрешает религиозные грабительские войны, если Víghugr является основным догматом текущего обряда."
 doctrine_parameter_nh_forced_conversion_allowed:0 "Разрешает насильственное обращение, если Víghugr является основным догматом текущего обряда."
 doctrine_parameter_nh_elite_warriors_allowed:0 "Разрешает решение «$nh_odinstru_raise_elite_warriors$», если Víghugr является основным догматом текущего обряда."
 doctrine_parameter_nh_vighugr_foreign_conversion_bonus:0 "+30 % к скорости обращения графств негерманских религий через совет правителя."
 doctrine_parameter_nh_odins_call_available:0 "Открывает решение «Последовать зову Одина», доступное один раз в жизни."
 nh_follow_odins_call_decision:0 "Последовать зову Одина"
 nh_follow_odins_call_decision_desc:0 "Уже несколько дней за мной следует ворон. На каждом привале чёрная птица садится неподалёку. Её взгляд тревожит меня сильнее, чем хочется признать. Даже во время молитвы я вновь думаю о ней. Впервые я задаюсь вопросом: действительно ли вера предков — моя собственная вера?"
 nh_follow_odins_call_decision_tooltip:0 "Пойти по следу чёрной птицы."
 nh_follow_odins_call_decision_confirm:0 "Услышать зов"
 nh_follow_odins_call_unavailable:0 "При этих обстоятельствах зов Одина мне недоступен."
 nh_follow_odins_call_blessing_desc:0 "Имена богов легко слетают с моих губ. Но в последнее время даже молитва не успокаивает мыслей. Многое остаётся невысказанным, а решения тяжестью ложатся на грудь.\n\nНа опушке сидит ворон. Встречая его взгляд, я вспоминаю старого странника и всё то, что скрыто даже от моих советников."
 nh_odins_call.0001.t:0 "Ворон у моего окна"
 nh_odins_call.0001.desc:0 "Ворон снова у моего окна. На этот раз я его не прогоняю. Открываю ставню, и холодный воздух касается моих рук. Птица почти не шевелится. Словно она ждала именно меня.\n\nЗнакомые слова вечерней молитвы с трудом сходят с губ. Я знаю их с детства, но сегодня они не утешают. Вместо них возвращается прошлый сон: просторный чертог, далёкие голоса и странник, чьё лицо наполовину скрыто тенью.\n\nПочему этот чужой образ приносит мне покой, которого я не нахожу в молитве?"
 nh_odins_call.0001.convert:0 "Óðinn, услышь мою клятву. Я последую за тобой."
 nh_odins_call.0001.refuse:0 "Никогда не склонюсь перед этими идолами!"
 nh_odins_call.not_now:0 "Не сейчас…"
 nh_odins_call.0002.t:0 "Под взором Всеотца"
 nh_odins_call.0002.desc:0 "У края священной рощи мои спутники умолкают. Среди ветвей скользит чёрная тень; два ворона кружат над святилищем. Я прижимаю ладонь к шершавой коре старого дерева.\n\nДолго не могу произнести ни слова. Слишком много голосов звучит в моей памяти, слишком часто я сомневаюсь в собственном суждении. Здесь, под ветвями, вспоминаются древние сказания о страннике.\n\nНаконец я склоняю голову. То, что хочется доверить Всеотцу, я едва решаюсь произнести при спутниках."
 nh_odins_call.0002.bless:0 "Всеотец, даруй мне частицу своей мудрости."
 nh_odins_call.0003.t:0 "Клятва под чужими звёздами"
 nh_odins_call.0003.desc:0 "Я произношу клятву в холодную ночь. На миг даже ветер словно замирает. Затем ворон раскрывает крылья и исчезает среди звёзд.\n\nСлова новой молитвы ещё непривычны. Я тихо повторяю их, пока голос не становится твёрже. Óðinn. Теперь, когда я произношу это имя без колебаний, оно звучит иначе.\n\nЗакрыв окно, я всё ещё чувствую тревогу. Но знаю, кому принадлежит моя клятва."
 nh_odins_call.0003.accept:0 "Клятва дана. Мой путь принадлежит богам."
 nh_odins_call.0004.t:0 "Дар одноглазого бога"
 nh_odins_call.0004.desc:0 "Когда последний огонь угасает, мысли наполняет незнакомый покой. В том, что прежде казалось запутанным, проступают связи: случайная фраза, долгое молчание, совет, который стоило выслушать внимательнее.\n\nНа обратном пути я говорю мало. Между деревьями шумит ветер, и где-то надо мной ему отвечает ворон. Я покидаю рощу с пустыми руками. И всё же кажется, будто я несу с собой нечто, чего прежде у меня не было."
 nh_odins_call.0004.accept:0 "Пусть мудрость ведёт меня, а честь переживёт."
 nh_odins_call.0005.t:0 "Моя вера непоколебима"
 nh_odins_call.0005.desc:0 "Я встречаю взгляд чёрной птицы и произношу знакомые слова своей веры. На этот раз голос не дрожит. Ворон склоняет голову, затем взлетает; взмахи крыльев затихают в сумерках.\n\nЯ ещё стою у открытого окна. Вопросы последних ночей не исчезли сами собой. Но я встречаю их прямо, а не отгоняю прочь.\n\nВозвращаясь к молитве, я яснее понимаю, почему произношу эти слова."
 nh_odins_call.0005.accept:0 "Я знаю свой путь."
