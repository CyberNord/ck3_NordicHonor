# Honorable Death
 nh_honorable_death_name:0 "Почётная смерть"
 nh_honorable_death_allowed_name:0 "Почётная смерть: разрешена"
 nh_honorable_death_allowed_desc:0 "Почётная смерть в бою открывает путь в Вальхаллу. Когда силы покидают воина, последний поединок позволяет достойно завершить его жизнь."
 nh_honorable_death_forbidden_name:0 "Почётная смерть: запрещена"
 nh_honorable_death_forbidden_desc:0 "Лишь Один решает, кто войдёт в Вальхаллу. Великие воины, мудрые правители и учёные могут услышать его зов; навязанный последний поединок считается варварским оскорблением его воли."
 doctrine_parameter_nh_last_duel_allowed:0 "Последний поединок разрешён."
 doctrine_parameter_nh_last_duel_forbidden:0 "Последний поединок запрещён. Эйнхерий не считается ни добродетелью, ни грехом."

