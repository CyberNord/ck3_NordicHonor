# Forn Siðr (North German)
 forn_sidr_pagan:0 "Irminsul"
 forn_sidr_pagan_adj:0 "Irminsul"
 forn_sidr_pagan_adherent:0 "последователь Irminsul"
 forn_sidr_pagan_adherent_plural:0 "последователи Irminsul"
 forn_sidr_pagan_desc:0 "Irminsul объединяет традиции Forn Siðr и Wōden Siðr. В их основе лежит почитание священных рощ, предков и древних германских богов."
 
