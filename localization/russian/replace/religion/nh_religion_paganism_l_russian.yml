 doctrine_parameter_nh_christian_marriage_acceptance: "Одно лишь различие веры больше не препятствует бракам наших последователей с христианами; остальные требования к браку сохраняются."


# Wōden Siðr
 woden_sidr_pagan:0 "Wōden Siðr"
 woden_sidr_pagan_adj:0 "Wōden Siðr"
 woden_sidr_pagan_adherent:0 "последователь Wōden Siðr"
 woden_sidr_pagan_adherent_plural:0 "последователи Wōden Siðr"
 woden_sidr_pagan_desc:0 "Англосаксонская и ютская традиция почитает Водена и древних богов, сохраняя священные обычаи, общие с Forn Siðr."

# Separate Faith and main-Rite names: Rite.name derives adjective/adherent keys from this prefix.
 nh_rite_norse_pagan:0 "Асатрийск"
 nh_rite_norse_pagan_adj:0 "Асатру"
 nh_rite_norse_pagan_adherent:0 "Асатрийец"
 nh_rite_norse_pagan_adherent_plural:0 "Асатрийцы"
 nh_rite_norse_pagan_desc:0 "Ásatrú почитает асов, ванов и унаследованные обычаи Севера. Подношения и праздники связывают общину с её богами."
 nh_rite_norse_pagan_old:0 "Старо-асатрийск"
 nh_rite_norse_pagan_old_adj:0 "Старое Асатру"
 nh_rite_norse_pagan_old_adherent:0 "Старо-асатриец"
 nh_rite_norse_pagan_old_adherent_plural:0 "Старо-асатрийцы"
 norse_pagan:0 "Æsirtrú"
 norse_pagan_adj:0 "Æsirtrú"
 norse_pagan_adherent:0 "последователь Æsirtrú"
 norse_pagan_adherent_plural:0 "последователи Æsirtrú"
 norse_pagan_desc:0 "Æsirtrú объединяет северные традиции Ásatrú, Gíñnregla и Óðinnstrú. Её обряды по-разному чтят общих богов."
 norse_pagan_old:0 "Древняя Æsirtrú"
 norse_pagan_old_adj:0 "Древняя Æsirtrú"
 norse_pagan_old_adherent:0 "последователь Древняя Æsirtrú"
 norse_pagan_old_adherent_plural:0 "последователи Древняя Æsirtrú"
 nh_rite_heidinn_pagan:0 "Heiðinn"
 nh_rite_heidinn_pagan_adj:0 "heiðinn"
 nh_rite_heidinn_pagan_adherent:0 "Heiðinn"
 nh_rite_heidinn_pagan_adherent_plural:0 "Heiðnir"
 nh_rite_heidinn_pagan_desc:0 "Скандинавско-славянский пантеон Heiðinn приспособился к грубым обычаям славянских народов. Он почитает скандинавских богов, сочетая скандинавские и славянские традиции. Последователи этой веры ценят свою связь с природой и практикуют ритуалы, объединяющие дикие элементы скандинавской мифологии и естественные циклы славянских традиций. Они видят скандинавских богов как могучих защитников и ищут их благосклонность в вопросах плодородия, урожая и выживания в суровых славянских регионах. Версия Асатру в Киеве таким образом сохраняет свою скандинавскую суть, но интегрирует элементы славянской культуры и обычаев, образуя уникальное сообщество верующих."
 nh_rite_heidinn_pagan_old:0 "Old Heiðinn"
 nh_rite_heidinn_pagan_old_adj:0 "Old heiðinn"
 nh_rite_heidinn_pagan_old_adherent:0 "Old Heiðnir"
 nh_rite_heidinn_pagan_old_adherent_plural:0 "Old Heiðnir"
 nh_rite_forn_sidr_pagan:0 "Forn Siðr"
 nh_rite_forn_sidr_pagan_adj:0 "Forn Siðr"
 nh_rite_forn_sidr_pagan_adherent:0 "Forn Siðrist"
 nh_rite_forn_sidr_pagan_adherent_plural:0 "Forn Siðrists"
 nh_rite_forn_sidr_pagan_desc:0 "Древний германский пантеон Forn Siðr характеризовался тесной связью с природой и глубоким почитанием естественных элементов. Они поклонялись Wótan в качестве верховного божества и верили в существование множества божеств, которые влияли на мир вокруг них. Для установления духовной связи с богами, язычники проводили ритуалы и церемонии, принося жертвы, они искренне просили поддержки и благословений во всех сферах своей жизни. Их верования также включали веру в судьбу и крепкую связь с предками. В целом, языческая вера саксов в северной Германии олицетворяла глубокую связь с природой, сильное чувство сообщества и веру в силу и мудрость их богов."
 nh_rite_forn_sidr_pagan_old:0 "Old Forn Siðr"
 nh_rite_forn_sidr_pagan_old_adj:0 "Old Forn Siðr"
 nh_rite_forn_sidr_pagan_old_adherent:0 "Old Forn Siðrar"
 nh_rite_forn_sidr_pagan_old_adherent_plural:0 "Old Forn Siðrar"
 nh_rite_natturugudtruar_pagan:0 "Náttúruguðtrúar"
 nh_rite_natturugudtruar_pagan_adj:0 "Náttúruguðtrúar"
 nh_rite_natturugudtruar_pagan_adherent:0 "Náttúruguðtrúarmaður"
 nh_rite_natturugudtruar_pagan_adherent_plural:0 "Náttúruguðtrúarmenn"
 nh_rite_natturugudtruar_pagan_desc:0 "Выражение, связанное с природой и известное как Náttúruguðtrúar, сочетает в себе элементы финно-угорских обычаев и олицетворяет глубокую связь с природным миром и колдовством. Эта система верований почитает скандинавских богов, соединяя их с традиционными практиками финно-угорских народов. Посредством колдовства и шаманских практик последователи этой веры стремятся к духовному прозрению и гармонии с природными силами. Их вдохновение находится в духах природы – леса, рек и гор. Они проводят ритуалы, чтобы укрепить связь с природой и подчеркнуть свое уважение к ее разнообразию и взаимодействию элементов. Суть их стремлений заключается в достижении сбалансированного и гармоничного существования в соответствии с Божественным и духами природы."
 nh_rite_natturugudtruar_pagan_old:0 "Old Náttúruguðtrúar"
 nh_rite_natturugudtruar_pagan_old_adj:0 "Old Náttúruguðtrúar"
 nh_rite_natturugudtruar_pagan_old_adherent:0 "Old Náttúruguðtrúarmaður"
 nh_rite_natturugudtruar_pagan_old_adherent_plural:0 "Old Náttúruguðtrúarmenn"

# Extinct pre-Christian Gothic rite of Erþtrú; no historical start followers.
 gothic_pagan:0 "Готский"
 gothic_pagan_adj:0 "готский"
 gothic_pagan_adherent:0 "готский язычник"
 gothic_pagan_adherent_plural:0 "готские язычники"
 gothic_pagan_desc:0 "Эта дохристианская готская традиция принадлежит Erþtrú. Она объединяет воинскую стойкость, жертвенные празднества и почитание предков. Исторические готы оставили прежние верования задолго до 867 года; этот угасший обряд представляет собой намеренное альтернативное возрождение."
