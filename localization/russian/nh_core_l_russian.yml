 # Nordic Honor bookmark
 bm_867_nh_nordic_honor:0 "Nordic Honor"
 bm_867_nh_nordic_honor_desc:0 "Германская вера далеко не так едина, как хотят представить христианские летописцы. Германское язычество, по природе своей многообразное и политеистическое, уходит корнями в глубокое прошлое и имеет множество обличий.\n\nБольшинство последователей исповедует #bold Æsirtrú#!, веру в асов. Для многих из них высшая цель — Вальгалла, чертог славы, чьи врата открываются прежде всего тем, кто с честью пал в бою.\n\nНа далёком севере, у границ саамских земель, возникла #bold Landvættir#! — более мирная вера, близкая к природе. В славянских землях, напротив, #bold Erþtrú#! возрождает германские верования, вобравшие в себя славянские традиции.\n\nНо борьба с набирающим силу христианством не знает пощады.\n\nСохранят ли вожди викингов верность вере предков? Сплотят ли древние традиции в единую религию или в конце концов примут верования и образ жизни христиан?\n\n#bold Ждёт ли мир новый Рагнарёк, последняя битва между старыми и новыми богами? Или даже Бог христиан найдёт своё место среди богов севера ради сохранения мира?#!"
 nh_bookmark_ivar:0 "Ивар Бескостный"
 nh_bookmark_ivar_desc:0 "Король Рагнар мёртв!\n\nЕго бросили в яму со змеями, словно бесчестного пленника. Христиане думали, что смогут лишить его славной смерти в бою и места в Вальгалле. Но Один не позволит такому человеку, как Рагнар, оказаться в Хель!\n\nХристиане должны заплатить за это бесчестье. Мира не будет, пока смерть Рагнара не отмщена!\n\nМы не успокоимся, пока вся Англия не обратится в пепел, её священники не будут принесены в жертву богам, а священные писания — преданы огню.\n\n#bold Никакой пощады! Никакого прощения! Так хочет Один!#!"
 nh_bookmark_ivar_subheading:0 "Мститель севера"
 nh_bookmark_dyre:0 "Дюре Киевский"
 nh_bookmark_dyre_desc:0 "Вдали от скандинавских фьордов Дюре взял судьбу в свои руки. Следуя по восточным рекам, северный искатель приключений добрался до Киева, где создал собственное владение.\n\nЗдесь боги севера встречаются с древними обычаями славян. Дюре знает, что правителю нужны не только острый меч и благословение Одина. Золото, союзы и верность подданных не менее ценны.\n\nВ этих чужих землях Дюре видит не только добычу, но и будущее. Он не желает забывать свои северные корни, но зачем отвергать обычаи и богов тех, кем он теперь правит?\n\nУкрепит ли Дюре северные традиции на востоке, соединит ли их со славянскими обычаями и создаст ли новое государство? Или его имя, как имена стольких искателей приключений, исчезнет в тумане истории?"
 nh_bookmark_dyre_subheading:0 "Владыка чужих земель"
 nh_bookmark_olafr:0 "Олафр Белый"
 nh_bookmark_olafr_desc:0 "Некогда Олафр Белый правил северянами Дублина. Его корабли несли войну и ужас побережьям Ирландии и Шотландии, а имя его было известно далеко за пределами Ирландского моря.\n\nНо одной славы недостаточно, чтобы оставить наследие. Олафр покинул прежний дом и вместе с верными соратниками отправился к новым берегам. Теперь он собирает силы на побережье Бретани, готовый вновь взять судьбу в свои руки.\n\nМир огромен, и за горизонтом ждут плодородные земли, богатые города и королевства, чьи правители ещё не боятся его прибытия.\n\n#bold Пойдёт ли Олафр по стопам предков и удовольствуется добычей и славой? Или создаст новое королевство, где обычаи и боги его пращуров будут почитаться ещё многими поколениями?#!"
 nh_bookmark_olafr_subheading:0 "К новым берегам"
 nh_bookmark_rollo:0 "Роллон"
 nh_bookmark_rollo_desc:0 "На родине, в Дании, Ролло слышит зов дальних странствий. Рассказы о богатых монастырях, чужих королевствах и славных сражениях пробуждают в нём жажду приключений. Зачем оставаться дома, если за морем слава и богатство ждут тех, кто достаточно смел, чтобы завладеть ими?\n\nОсобенно богатую добычу сулят земли франков. Их короли борются за власть и влияние, а реки и побережья их владений открыты для северных драккаров. С верным отрядом воинов Ролло мог бы попытать там счастья и прославить своё имя.\n\nНо мир за морем таит не только золото и серебро. Чужие обычаи, могущественные правители и вера в распятого Бога могут изменить его судьбу так, как он и представить не мог.\n\n#bold Обретёт ли Ролло славу и богатство, став грозным викингом? Найдёт ли новый дом под защитой Одина? Или однажды примет крест и положит начало наследию, чьего значения пока не способен осознать даже он сам?#!"
 nh_bookmark_rollo_subheading:0 "Между молотом и крестом"
 nh_bookmark_audr:0 "Ауд Мудрая"
 nh_bookmark_audr_desc:0 "В мире, где короли решают споры мечом, а воины стремятся к славе и богатству, Ауд Мудрая намерена проложить собственный путь.\n\nВыросшая на стыке северных традиций и чуждых обычаев христианского мира, она знает и силу веры, и непрочность земной власти. Но пока старые боги ещё хранят судьбы своих последователей, вера в распятого Бога неумолимо распространяется.\n\nДалеко в Северной Атлантике лежит таинственный остров, созданный огнём и льдом, где сама земля словно дышит. Рассказывают о скрытых силах, древних духах и землях, ещё не покорявшихся ни одному королю. Может быть, именно здесь старые боги обещают своим последователям новый дом?\n\nНо, быть может, будущее её народа — не в уединении Исландии, а в принятии христианства и мирном сосуществовании с народами запада.\n\n#bold Последует ли Ауд зову старых богов и создаст ли в Исландии новый дом под их защитой? Или примет крест и поведёт своих северных соотечественников в новую эпоху?#!"
 nh_bookmark_audr_subheading:0 "Княгиня огня и льда"
 nh_bookmark_sverker:0 "Сверкер из Онгерманланда"
 nh_bookmark_sverker_desc:0 "На далёком севере, среди густых лесов, глубоких озёр и древних святилищ, последователи Landvættir хранят верность унаследованной вере. Они почитают старых богов и духов природы, которые оберегали их родную землю на протяжении бесчисленных поколений.\n\nНо времена меняются. Могущественные правители Æsirtrú презирают своих близких к природе братьев по вере, а соседние последователи Уконуско тоже относятся к ним с недоверием.\n\nБыть может, будущее его народа лежит не на поле боя, а в самой вере. Пока христианство распространяется всё дальше, соединение его учения с древними традициями может открыть новый путь к мирному сосуществованию.\n\n#bold Удастся ли защитить древних духов и святилища от влияния могущественных соседей? Смогут ли учение Христа и мудрость старых богов объединиться в новой вере? Или этот последний оплот Landvættir в конце концов погибнет в пламени войны?#!"
 nh_bookmark_sverker_subheading:0 "Хранитель лесных духов"
 nh_bookmark_haraldr:0 "Харальд Косматый"
 nh_bookmark_haraldr_desc:0 "Норвегия раздроблена. Бесчисленные вожди и мелкие короли правят её фьордами, долинами и горами. Распри и давнее соперничество определяют судьбу жителей, и ещё никому не удалось объединить всю страну под одной короной.\n\nНо Харальд дал великую клятву. Когда гордая Гюда отвергла его сватовство и заявила, что выйдет лишь за того, кто будет править всей Норвегией, он принял судьбоносное решение: ни ножницы, ни гребень не коснутся его волос, пока вся страна не покорится его власти.\n\nС тех пор он носит прозвище Косматый. То, что другим кажется глупым хвастовством, для Харальда — священная клятва, которую он намерен исполнить перед богами и предками.\n\nНо короли Норвегии не отдадут свою свободу без боя. Кровавые сражения, хрупкие союзы и предательство ждут каждого, кто дерзнёт посягнуть на власть над всей страной.\n\n#bold Сдержит ли Харальд клятву, объединит ли Норвегию под одной короной и войдёт ли в историю как Прекрасноволосый? Или необузданное честолюбие погубит его самого и весь его род?#!"
 nh_bookmark_haraldr_subheading:0 "Король для Норвегии"

