l_russian:
 # Casus Belli Names
 NH_HOLY_CONQUEST_WAR_NAME:0 "Религиозный грабительский поход"
 NH_HOLY_CONQUEST_WAR_NAME_BASE:0 "Религиозный грабительский поход"
 NH_HOLY_CONQUEST_CB_NAME:0 "Религиозный грабительский поход"

 # CB Descriptions
 nh_holy_conquest_cb:0 "Религиозный грабительский поход"
 nh_holy_conquest_cb_desc:0 "Во славу Одина мы выступаем против чужих святилищ. Пусть враги страшатся могущества Всеотца."

 # Victory/Defeat Descriptions
 nh_holy_conquest_cb_victory_desc_attacker:0 "Ваш религиозный грабительский поход завершился победой. Противник: [SCOPE.sC('defender').GetUIName].\n\n$nh_holy_raid_full_victory_terms_desc$"
 nh_holy_conquest_cb_victory_desc:0 "[SCOPE.sC('attacker').GetUIName] — победившая сторона в религиозном грабительском походе; [SCOPE.sC('defender').GetUIName] — побеждённая.\n\n$nh_holy_raid_full_victory_terms_desc$"
 nh_holy_conquest_cb_white_peace_desc_defender:0 "Религиозный грабительский поход завершился белым миром. Нападающая сторона: [SCOPE.sC('attacker').GetUIName].\n\n$nh_holy_raid_white_peace_terms_desc$"
 nh_holy_conquest_cb_white_peace_desc:0 "Религиозный грабительский поход заканчивается религиозной неудачей нападающей стороны.\n\n$nh_holy_raid_white_peace_terms_desc$"
 nh_holy_conquest_cb_defeat_desc_defender:0 "Вы одержали победу в религиозном грабительском походе. Нападающая сторона: [SCOPE.sC('attacker').GetUIName].\n\n$nh_holy_raid_defense_victory_terms_desc$"
 nh_holy_conquest_cb_defeat_desc_attacker:0 "Ваш религиозный грабительский поход завершился поражением. Противник: [SCOPE.sC('defender').GetUIName].\n\n$nh_holy_raid_defense_victory_terms_desc$"
 nh_holy_conquest_cb_defeat_desc:0 "[SCOPE.sC('defender').GetUIName] — победившая сторона в религиозном грабительском походе; [SCOPE.sC('attacker').GetUIName] — побеждённая.\n\n$nh_holy_raid_defense_victory_terms_desc$"

 # CB Cost Reasons
 CB_HOLY_WAR_COST:0 "Религиозный грабительский поход"
 CB_CONQUEST_COST:0 "Религиозный грабительский поход"

 # Fervor Reasons
 fervor_holy_conquest_declared:0 "Объявлен религиозный грабительский поход"
 fervor_holy_conquest_victory:0 "Победа в религиозном грабительском походе"
 fervor_holy_conquest_defeat:0 "Поражение в религиозном грабительском походе"
 fervor_holy_conquest_white_peace:0 "Религиозная неудача при белом мире"
 fervor_holy_conquest_defense_victory:0 "Религиозный грабительский поход отражён"

 # Outcome terms
 nh_holy_raid_gold_terms_desc:0 "Побеждённая сторона выплачивает победителю большую из двух сумм: 24 неотрицательных месячных дохода или 10 % доступного личного золота. Выплата не превышает запас доступного золота. При его отсутствии выплаты нет; эта компенсация не создаёт новых долгов."
 nh_holy_raid_full_victory_terms_desc:0 "Вера победившей стороны получает 15 процентных пунктов рвения, а вера побеждённой теряет 5.\n$nh_holy_raid_gold_terms_desc$\nПобедившая сторона получает до трёх доступных придворных побеждённой стороны не моложе 18 лет и пятерых новых пленников от 30 до 50 лет включительно с верой, тем же течением и культурой побеждённой стороны. Их заключают в темницу победителя по обычным правилам.\nПобеждённая сторона получает модификатор «$nh_holy_raid_odins_curse_modifier$» на девять лет. Земли, титулы и вассалы не передаются. Остальные обычные последствия войны и перемирие сохраняются.\nПосле любого обычного исхода войны тот же нападающий не может объявить новый религиозный набег на того же правителя в течение года."
 nh_holy_raid_white_peace_terms_desc:0 "Белый мир означает религиозную неудачу для нападающей стороны: её вера теряет 20 процентных пунктов рвения, а правитель получает модификатор «$nh_holy_raid_odins_curse_modifier$» на три года. Рвение веры обороняющейся стороны не меняется. Нет дополнительной компенсации, новых пленников или передачи земель, титулов и вассалов. Остальные обычные последствия войны и перемирие сохраняются.\nПосле любого обычного исхода войны тот же нападающий не может объявить новый религиозный набег на того же правителя в течение года."
 nh_holy_raid_defense_victory_terms_desc:0 "Конфессия защитника получает 15 пунктов рвения, а конфессия нападающего теряет 25 пунктов.\n$nh_holy_raid_gold_terms_desc$\nПобеждённый нападающий получает $nh_holy_raid_odins_curse_modifier$ на девять лет. Защитник не получает дополнительных пленников; обычные военнопленные остаются без изменений. Земли, титулы и вассалы не передаются. Остальные обычные последствия войны и перемирие сохраняются.\nПосле любого обычного исхода войны тот же нападающий не может объявить новый религиозный набег на того же правителя в течение года."
 nh_holy_raid_cooldown_tt:0 "С окончания вашего последнего религиозного набега на этого правителя должен пройти год. Нарушение перемирия не позволяет обойти этот запрет."
