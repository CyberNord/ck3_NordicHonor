l_english:
 nh_tenet_vighugr_name:0 "Víghugr"
 nh_tenet_vighugr_desc:0 "Religious zeal and readiness for battle fill those who regard war as a sacred duty. Steadfast in faith and fearless in combat, they strive for a place in Valhöll."
 doctrine_parameter_nh_holy_raid_allowed:0 "Allows religious plundering wars when the current rite holds Víghugr as a core tenet."
 doctrine_parameter_nh_forced_conversion_allowed:0 "Allows forced conversion when the current rite holds Víghugr as a core tenet."
 doctrine_parameter_nh_vighugr_foreign_conversion_bonus:0 "+30% county conversion speed against non-Germanic religions through the ruler's council."
 doctrine_parameter_nh_odins_call_available:0 "Enables the once-per-lifetime decision “Heed Odin's Call”."
 nh_follow_odins_call_decision:0 "Heed Odin's Call"
 nh_follow_odins_call_decision_desc:0 "For several days, a raven has followed me. Wherever I rest, the black bird settles nearby. Its gaze unsettles me more than I care to admit. Even at prayer, my thoughts return to it. For the first time, I wonder whether the faith of my ancestors is truly my own."
 nh_follow_odins_call_decision_tooltip:0 "Follow the black bird's trail."
 nh_follow_odins_call_decision_confirm:0 "Listen to the call"
 nh_follow_odins_call_unavailable:0 "Odin's call is unavailable to me in these circumstances."
 nh_follow_odins_call_blessing_desc:0 "The names of the gods come readily to my lips. Lately, though, even prayer brings my thoughts no rest. Words go unspoken, and decisions weigh heavily upon my chest.\n\nA raven sits at the edge of the woods. As I meet its gaze, I think of the old wanderer, and of all that remains hidden even from my counselors."
 nh_odins_call.0001.t:0 "The Raven at My Window"
 nh_odins_call.0001.desc:0 "The raven is at my window again. This time I do not drive it away. I open the shutter, and cold air brushes my hands. The bird scarcely moves. It is as though it has been waiting for me.\n\nThe familiar words of my evening prayer falter upon my lips. I have known them since childhood, yet tonight they offer me no comfort. Instead, last night's dream returns: a great hall, distant voices, and a wanderer whose face lies half in shadow.\n\nWhy do I find in this unfamiliar vision the peace that eludes me in prayer?"
 nh_odins_call.0001.convert:0 "Óðinn, hear my oath. I shall follow you."
 nh_odins_call.0001.refuse:0 "Never shall I bow to these idols!"
 nh_odins_call.not_now:0 "Not now…"
 nh_odins_call.0002.t:0 "Beneath the Allfather's Gaze"
 nh_odins_call.0002.desc:0 "At the edge of the grove, my companions fall silent. A black shadow moves among the branches; two ravens circle above the sacred ground. I lay my hand against the old tree's rough bark.\n\nFor a long while, I cannot speak. I have listened to too many voices and questioned my own judgment too often. Here beneath the branches, the old tales of the wanderer return to me.\n\nAt last I bow my head. What I wish to entrust to the Allfather, I have scarcely dared to say before my companions."
 nh_odins_call.0002.bless:0 "Allfather, grant me a share of your wisdom."
 nh_odins_call.0003.t:0 "An Oath Beneath Unfamiliar Stars"
 nh_odins_call.0003.desc:0 "I speak my oath into the cold night. For a moment, even the wind seems to pause. Then the raven spreads its wings and vanishes among the stars.\n\nThe words of my new prayer are still unfamiliar. I repeat them softly until my voice grows steadier. Óðinn. The name sounds different now that I speak it without hesitation.\n\nWhen I close the window, my unease has not quite left me. But I know to whom my oath is given."
 nh_odins_call.0003.accept:0 "My oath is spoken. My path belongs to the gods."
 nh_odins_call.0004.t:0 "The One-Eyed God's Gift"
 nh_odins_call.0004.desc:0 "As the last sacrificial fire fades, an unfamiliar calm settles over my thoughts. What once seemed tangled begins to reveal its pattern: a passing remark, a long silence, advice I dismissed too hastily.\n\nOn the way back, I say little. The wind stirs among the trees, and somewhere above me a raven answers. I leave the grove empty-handed. Even so, I feel as though I carry something I did not possess when I arrived."
 nh_odins_call.0004.accept:0 "Let wisdom guide me and honor outlive me."
 nh_odins_call.0005.t:0 "My Faith Holds Firm"
 nh_odins_call.0005.desc:0 "I meet the black bird's gaze and speak the familiar words of my faith. This time, my voice does not falter. The raven tilts its head, then takes flight, its wingbeats fading into the dusk.\n\nI linger at the open window. The questions of the past nights have not simply fallen silent. But I have faced them instead of merely pushing them aside.\n\nWhen I return to my prayer, I understand more clearly why I speak these words."
 nh_odins_call.0005.accept:0 "I know my path."
