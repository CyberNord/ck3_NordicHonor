 # Nordic Honor bookmark
 bm_867_nh_nordic_honor:0 "Nordic Honor"
 bm_867_nh_nordic_honor_desc:0 "The Germanic faith is far less united than Christian chroniclers would have us believe. Pluralistic and polytheistic by nature, Germanic paganism reaches far into the past and takes many forms.\n\nMost of its followers embrace #bold Æsirtrú#!, the worship of the Æsir. For many, Valhalla is the highest aspiration: a hall of glory whose gates open above all to those who fall honorably in battle.\n\nIn the far north, along the borders of the Sámi lands, #bold Landvættir#! developed as a more peaceful faith, closer to nature. In the Slavic lands, meanwhile, #bold Erþtrú#! lives on as a revived form of Germanic belief shaped by Slavic traditions.\n\nYet the struggle against the growing strength of Christianity is relentless.\n\nWill the Viking lords hold fast to the faith of their ancestors? Will they forge their ancient traditions into a united religion, or ultimately embrace the beliefs and way of life of the Christians?\n\n#bold Does a new Ragnarök await the world, a final struggle between the old gods and the new? Or will even the Christians' God find a place among the gods of the north, so that peace may endure?#!"
 nh_bookmark_ivar:0 "Ivar the Boneless"
 nh_bookmark_ivar_desc:0 "King Ragnar is dead!\n\nLike a dishonored prisoner, he was thrown into a pit of snakes. The Christians thought they could deny him an honorable death in battle and his place in Valhalla. But Odin will not allow a man like Ragnar to end up in Hel!\n\nThe Christians must pay for this outrage. There can be no peace while Ragnar's death remains unavenged!\n\nOnly when all England lies in ashes, its priests have been sacrificed to the gods, and its holy scriptures consigned to the flames will we rest.\n\n#bold No mercy! No forgiveness! Odin wills it!#!"
 nh_bookmark_ivar_subheading:0 "Avenger of the North"
 nh_bookmark_dyre:0 "Dyre of Kyiv"
 nh_bookmark_dyre_desc:0 "Far from the fjords of Scandinavia, Dyre has taken his fate into his own hands. Following the rivers of the east, the Norse adventurer reached Kyiv, where he carved out a realm of his own.\n\nHere, the gods of the north meet the ancient customs of the Slavs. Dyre knows that a ruler needs more than a sharp sword and Odin's blessing. Gold, alliances, and the loyalty of his subjects are just as precious.\n\nIn these foreign lands, Dyre sees more than plunder: he sees a future. He has no wish to forget his Norse roots, but why should he spurn the customs and gods of those he now rules?\n\nWill Dyre strengthen Norse traditions in the east, unite them with Slavic customs, and establish a new realm? Or will his name, like those of so many adventurers, disappear into the mists of history?"
 nh_bookmark_dyre_subheading:0 "Lord of Foreign Lands"
 nh_bookmark_olafr:0 "Olafr the White"
 nh_bookmark_olafr_desc:0 "Olafr the White once ruled the Northmen of Dublin. His ships brought war and terror to the coasts of Ireland and Scotland, and his name became known far beyond the Irish Sea.\n\nBut glory alone does not make a legacy. Olafr has left his former home behind and set out for new shores with his loyal followers. On the coast of Brittany, he now gathers his strength, ready once more to take his fate into his own hands.\n\nThe world is vast, and beyond the horizon lie fertile lands, rich cities, and kingdoms whose rulers do not yet fear his arrival.\n\n#bold Will Olafr follow in the footsteps of his ancestors and content himself with plunder and glory? Or will he establish a new kingdom where the customs and gods of his forefathers are honored for generations to come?#!"
 nh_bookmark_olafr_subheading:0 "Setting Sail for New Shores"
 nh_bookmark_rollo:0 "Rollo"
 nh_bookmark_rollo_desc:0 "In his Danish homeland, Rollo feels the call of distant shores. Tales of wealthy monasteries, foreign kingdoms, and glorious battles stir his thirst for adventure. Why should he remain at home when fame and riches await across the sea, there for anyone bold enough to seize them?\n\nThe rich lands of the Franks promise particularly rewarding plunder. Their kings struggle for power and influence, while the rivers and coasts of their realms lie open to Norse longships. With a loyal band of warriors, Rollo could try his fortune there and make a name for himself.\n\nBut the world beyond the sea holds more than gold and silver. Foreign customs, mighty rulers, and belief in the crucified God could change his fate in ways he never imagined.\n\n#bold Will Rollo win glory and riches as a feared Viking? Will he find a new home under Odin's protection? Or will he one day embrace the cross and found a legacy whose significance even he cannot yet foresee?#!"
 nh_bookmark_rollo_subheading:0 "Between Hammer and Cross"
 nh_bookmark_audr:0 "Auður the Deep-Minded"
 nh_bookmark_audr_desc:0 "In a world where kings settle their disputes with the sword and warriors pursue glory and riches, Auður the Deep-Minded is determined to follow her own path.\n\nRaised between the traditions of the north and the unfamiliar customs of the Christian world, she knows both the power of faith and the fleeting nature of earthly rule. Yet while the old gods still watch over the fates of their followers, belief in the crucified God spreads relentlessly.\n\nFar out in the North Atlantic lies a mysterious island, shaped by fire and ice, where the earth itself seems to breathe. Tales speak of hidden powers, ancient spirits, and lands that have never bowed to a king. Could this be the place where the old gods promise their followers a new home?\n\nPerhaps, though, her people's future lies not in Iceland's isolation, but in embracing Christianity and living in peace with the peoples of the west.\n\n#bold Will Auður heed the call of the old gods and establish a new home in Iceland under their protection? Or will she embrace the cross and lead her Norse countrymen into a new age?#!"
 nh_bookmark_audr_subheading:0 "Lady of Fire and Ice"
 nh_bookmark_sverker:0 "Sverker of Ångermanland"
 nh_bookmark_sverker_desc:0 "In the far north, where dense forests, deep lakes, and ancient sacred sites shape the land, the followers of Landvættir hold fast to their ancestral faith. They worship the old gods and the spirits of nature that have watched over their homeland for countless generations.\n\nBut times are changing. The mighty rulers of Æsirtrú look down on their nature-loving brethren, while the neighboring followers of Ukonusko regard them with equal suspicion.\n\nPerhaps his people's future lies not on the battlefield, but in faith itself. As Christianity continues to spread, a union of its teachings with the ancient traditions could open a new path toward peaceful coexistence.\n\n#bold Can the ancient spirits and sacred sites be protected from the influence of powerful neighbors? Can Christ's teachings and the wisdom of the old gods be united in a new faith? Or will this last refuge of Landvættir ultimately fall to the flames of war?#!"
 nh_bookmark_sverker_subheading:0 "Guardian of the Forest Spirits"
 nh_bookmark_haraldr:0 "Haraldr Tanglehair"
 nh_bookmark_haraldr_desc:0 "Norway is a divided land. Countless chieftains and petty kings rule its fjords, valleys, and mountains. Feuds and old rivalries shape the lives of its people, and no one has yet succeeded in uniting the whole land beneath a single crown.\n\nBut Haraldr has sworn a mighty oath. When the proud Gyða rejected his suit and declared that she would marry only a man who ruled all Norway, he made a momentous decision: neither shears nor comb would touch his hair until the entire land had submitted to his rule.\n\nEver since, he has borne the name Tanglehair. What others might dismiss as foolish boasting is, for Haraldr, a sacred oath he intends to fulfill before the gods and his ancestors.\n\nBut Norway's kings will not surrender their freedom without a fight. Bloody battles, fragile alliances, and betrayal await anyone who dares reach for dominion over the whole land.\n\n#bold Will Haraldr fulfill his oath, unite Norway under one crown, and go down in history as Fairhair? Or will his unbridled ambition lead him and his dynasty to ruin?#!"
 nh_bookmark_haraldr_subheading:0 "A King for Norway"

