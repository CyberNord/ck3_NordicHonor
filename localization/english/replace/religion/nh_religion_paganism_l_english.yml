 nh_honorable_death_forbidden_desc:0 "Odin alone chooses those who enter Valhöll. Great warriors, wise rulers and scholars may hear his call; forcing a last duel is a barbaric affront to his judgment."
 doctrine_parameter_nh_last_duel_allowed:0 "The Last Duel is allowed."
 doctrine_parameter_nh_last_duel_forbidden:0 "The Last Duel is forbidden. Einherjar is neither a virtue nor a sin."

