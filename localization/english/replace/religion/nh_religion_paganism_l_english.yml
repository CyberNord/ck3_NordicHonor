 nh_honorable_death_allowed_name:0 "Honorable Death: Allowed"
 nh_honorable_death_allowed_desc:0 "An honorable death in battle is the path to Valhöll. When strength begins to fade, a last duel offers a worthy end to a warrior’s life."
