l_english:
 # Casus Belli Names
 NH_HOLY_CONQUEST_WAR_NAME:0 "Holy Conquest for [TITLE.GetNameNoTierNoTooltip|U]"
 NH_HOLY_CONQUEST_WAR_NAME_BASE:0 "Holy Conquest"
 NH_HOLY_CONQUEST_CB_NAME:0 "Holy Conquest"
 
 # CB Descriptions
 nh_holy_conquest_cb:0 "Holy Conquest"
 nh_holy_conquest_cb_desc:0 "Óðinnstrú faithful may wage holy conquest against infidels to claim entire duchies in the name of the Allfather. This aggressive form of holy war demonstrates uncompromising religious zeal."
 
 # Victory/Defeat Descriptions
 nh_holy_conquest_cb_victory_desc_attacker:0 "You have conquered [TITLE.GetNameNoTier] in the name of Óðinnstrú, converting the land and subjugating the faithless."
 nh_holy_conquest_cb_victory_desc:0 "[SCOPE.sC('attacker').GetUIName] has conquered [TITLE.GetNameNoTier] through holy conquest, imposing Óðinnstrú upon the defeated."
 
 nh_holy_conquest_cb_white_peace_desc_defender:0 "You have held firm against [SCOPE.sC('attacker').GetUIName]'s holy conquest. The war ends inconclusively."
 nh_holy_conquest_cb_white_peace_desc:0 "The holy conquest for [TITLE.GetNameNoTier] ends without a clear victor."
 
 nh_holy_conquest_cb_defeat_desc_defender:0 "You have repelled [SCOPE.sC('attacker').GetUIName]'s holy conquest, defending your lands and faith."
 nh_holy_conquest_cb_defeat_desc_attacker:0 "Your holy conquest has failed. The Allfather's will was not strong enough."
 nh_holy_conquest_cb_defeat_desc:0 "[SCOPE.sC('attacker').GetUIName]'s holy conquest has been defeated by [SCOPE.sC('defender').GetUIName]."
 
 # CB Cost Reasons
 CB_HOLY_WAR_COST:0 "Holy War"
 CB_CONQUEST_COST:0 "Conquest"
 
 # Fervor Reasons
 fervor_holy_conquest_declared:0 "Holy Conquest Declared"
 fervor_holy_conquest_victory:0 "Holy Conquest Victory"
 fervor_holy_conquest_defeat:0 "Holy Conquest Defeat"
 fervor_holy_conquest_white_peace:0 "Holy Conquest Stalemate"
 fervor_holy_conquest_defense_victory:0 "Defended Against Holy Conquest"
