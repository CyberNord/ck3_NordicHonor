# Separate Faith and main-Rite names: Rite.name derives adjective/adherent keys from this prefix.
 nh_rite_norse_pagan:0 "Ásatrú"
 nh_rite_norse_pagan_adj:0 "ásatrú"
 nh_rite_norse_pagan_adherent:0 "ásatrúar"
 nh_rite_norse_pagan_adherent_plural:0 "ásatrúars"
 nh_rite_norse_pagan_desc:0 "Ásatrú honra a los Æsir, los Vanir y las costumbres ancestrales del norte. Las ofrendas y las fiestas unen a la comunidad con sus dioses."
 nh_rite_norse_pagan_old:0 "Antiguo Ásatrú"
 nh_rite_norse_pagan_old_adj:0 "ásatrú antigua"
 nh_rite_norse_pagan_old_adherent:0 "ásatrúar viejo"
