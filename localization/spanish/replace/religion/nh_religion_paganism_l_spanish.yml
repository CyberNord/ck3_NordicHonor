 special_faith_has_germanic_heritage_name: "Nordic Similarity"
 special_faith_has_germanic_heritage_desc: "Though our rites differ, we recognize the same gods and honor the bonds of our ancestors."
 
 special_faith_stadfast_heritage_name:0 "Staðfast"
 special_faith_stadfast_heritage_desc: "Solo nosotros conservamos intactas las enseñanzas de nuestros antepasados. Nuestros hermanos de fe se han ablandado y siguen un ideal falso."
