 # Nordic Honor bookmark
 bm_867_nh_nordic_honor:0 "Nordic Honor"
 bm_867_nh_nordic_honor_desc:0 "La fe germánica está mucho menos unida de lo que los cronistas cristianos pretenden hacernos creer. Pluralista y politeísta por naturaleza, el paganismo germánico hunde sus raíces en un pasado remoto y adopta numerosas formas.\n\nLa mayoría de sus fieles sigue el #bold Æsirtrú#!, la fe en los Aesir. Para muchos, el Valhalla es la aspiración suprema: un salón de gloria cuyas puertas se abren, ante todo, a quienes caen con honor en combate.\n\nEn el lejano norte, en los confines de las tierras de los sami, surgió #bold Landvættir#!, una corriente más pacífica y cercana a la naturaleza. En las tierras eslavas, en cambio, #bold Erþtrú#! revive una forma de la fe germánica marcada por las tradiciones eslavas.\n\nPero la lucha contra un cristianismo cada vez más poderoso es implacable.\n\n¿Se aferrarán los señores vikingos a la fe de sus antepasados? ¿Forjarán una religión unida a partir de sus antiguas tradiciones o acabarán adoptando las creencias y el modo de vida de los cristianos?\n\n#bold ¿Se avecina un nuevo Ragnarök, una última batalla entre los dioses antiguos y los nuevos? ¿O incluso el Dios de los cristianos encontrará un lugar entre los dioses del norte para preservar la paz?#!"
 nh_bookmark_ivar:0 "Ivar el Deshuesado"
 nh_bookmark_ivar_desc:0 "¡El rey Ragnar ha muerto!\n\nLo arrojaron a un foso lleno de serpientes como a un prisionero deshonrado. Los cristianos creían que así podrían negarle una muerte honorable en combate y su lugar en el Valhalla. ¡Pero Odín no permitirá que un hombre como Ragnar acabe en Hel!\n\nLos cristianos deben pagar por esta infamia. ¡No puede haber paz mientras la muerte de Ragnar siga sin vengarse!\n\nSolo descansaremos cuando toda Inglaterra haya quedado reducida a cenizas, sus sacerdotes hayan sido sacrificados a los dioses y sus sagradas escrituras hayan sido entregadas a las llamas.\n\n#bold ¡Sin piedad! ¡Sin perdón! ¡Odín lo quiere!#!"
 nh_bookmark_ivar_subheading:0 "El vengador del Norte"
 nh_bookmark_dyre:0 "Dyre de Kiev"
 nh_bookmark_dyre_desc:0 "Lejos de los fiordos de Escandinavia, Dyre ha tomado las riendas de su destino. Siguiendo los ríos del este, este aventurero nórdico llegó hasta Kiev, donde se labró un dominio propio.\n\nAquí, los dioses del norte se encuentran con las antiguas costumbres de los eslavos. Dyre sabe que un gobernante necesita algo más que una espada afilada y la bendición de Odín. El oro, las alianzas y la lealtad de sus súbditos son igual de valiosos.\n\nEn estas tierras extranjeras, Dyre no solo ve botín, sino también un futuro. No quiere olvidar sus raíces nórdicas, pero ¿por qué habría de despreciar las costumbres y los dioses de aquellos a quienes ahora gobierna?\n\n¿Afianzará Dyre las tradiciones nórdicas en el este, las unirá a las costumbres eslavas y fundará un nuevo reino? ¿O su nombre, como el de tantos otros aventureros, desaparecerá entre las brumas de la historia?"
 nh_bookmark_dyre_subheading:0 "El señor de tierras extranjeras"
 nh_bookmark_olafr:0 "Olafr el Blanco"
 nh_bookmark_olafr_desc:0 "Olafr el Blanco gobernó antaño a los hombres del norte de Dublín. Sus barcos llevaron la guerra y el terror a las costas de Irlanda y Escocia, y su nombre se hizo conocido mucho más allá del mar de Irlanda.\n\nPero la gloria por sí sola no crea un legado. Olafr ha dejado atrás su antiguo hogar y ha partido hacia nuevas costas junto a sus fieles. Ahora reúne sus fuerzas en la costa de Bretaña, dispuesto a tomar de nuevo las riendas de su destino.\n\nEl mundo es vasto y, más allá del horizonte, lo aguardan tierras fértiles, ciudades ricas y reinos cuyos gobernantes aún no temen su llegada.\n\n#bold ¿Seguirá Olafr los pasos de sus antepasados y se conformará con el botín y la gloria? ¿O fundará un nuevo reino en el que las costumbres y los dioses de sus ancestros sean venerados durante generaciones?#!"
 nh_bookmark_olafr_subheading:0 "Rumbo a nuevas costas"
 nh_bookmark_rollo:0 "Rollo"
 nh_bookmark_rollo_desc:0 "En su Dinamarca natal, Rollo siente la llamada de tierras lejanas. Los relatos de monasterios ricos, reinos extranjeros y batallas gloriosas despiertan su sed de aventuras. ¿Por qué quedarse en casa cuando al otro lado del mar la fama y la riqueza esperan a quienes tienen el valor de hacerse con ellas?\n\nLas ricas tierras de los francos prometen un botín especialmente tentador. Sus reyes se disputan el poder y la influencia, mientras los ríos y las costas de sus reinos quedan al alcance de los drakkars nórdicos. Con una hueste de guerreros leales, Rollo podría probar fortuna allí y hacerse un nombre.\n\nPero el mundo al otro lado del mar encierra algo más que oro y plata. Las costumbres extranjeras, los soberanos poderosos y la fe en el Dios crucificado podrían transformar su destino de formas que aún no imagina.\n\n#bold ¿Alcanzará Rollo la gloria y la riqueza como un vikingo temido? ¿Hallará un nuevo hogar bajo la protección de Odín? ¿O abrazará algún día la cruz y fundará un legado cuya importancia ni siquiera él puede todavía vislumbrar?#!"
 nh_bookmark_rollo_subheading:0 "Entre el martillo y la cruz"
 nh_bookmark_audr:0 "Auður la Sabia"
 nh_bookmark_audr_desc:0 "En un mundo donde los reyes resuelven sus disputas con la espada y los guerreros persiguen gloria y riqueza, Auður la Sabia está decidida a seguir su propio camino.\n\nCriada entre las tradiciones del norte y las extrañas costumbres del mundo cristiano, conoce tanto el poder de la fe como lo efímero del dominio terrenal. Pero, mientras los dioses antiguos aún velan por el destino de sus fieles, la fe en el Dios crucificado se extiende sin descanso.\n\nLejos, en el Atlántico Norte, se alza una isla misteriosa, moldeada por el fuego y el hielo, donde la propia tierra parece respirar. Se cuentan historias de poderes ocultos, espíritus ancestrales y tierras que jamás han estado sometidas a un rey. ¿Será ese el lugar donde los dioses antiguos prometen un nuevo hogar a sus fieles?\n\nSin embargo, quizá el futuro de su pueblo no resida en el aislamiento de Islandia, sino en abrazar el cristianismo y convivir en paz con los pueblos de occidente.\n\n#bold ¿Acudirá Auður a la llamada de los dioses antiguos y fundará un nuevo hogar en Islandia bajo su protección? ¿O abrazará la cruz y guiará a sus compatriotas nórdicos hacia una nueva era?#!"
 nh_bookmark_audr_subheading:0 "Señora del fuego y el hielo"
 nh_bookmark_sverker:0 "Sverker de Ångermanland"
 nh_bookmark_sverker_desc:0 "En el lejano norte, donde densos bosques, lagos profundos y antiguos lugares sagrados dan forma a la tierra, los fieles de Landvættir se aferran a su fe ancestral. Veneran a los dioses antiguos y a los espíritus de la naturaleza que han velado por su hogar durante incontables generaciones.\n\nPero los tiempos cambian. Los poderosos gobernantes del Æsirtrú miran con desprecio a sus hermanos de fe cercanos a la naturaleza, mientras que los fieles vecinos del Ukonusko los observan con igual desconfianza.\n\nQuizá el futuro de su pueblo no esté en el campo de batalla, sino en la propia fe. Mientras el cristianismo sigue extendiéndose, unir sus enseñanzas a las antiguas tradiciones podría abrir un nuevo camino hacia la convivencia pacífica.\n\n#bold ¿Será posible preservar a los espíritus ancestrales y los lugares sagrados de la influencia de vecinos poderosos? ¿Podrán las enseñanzas de Cristo y la sabiduría de los dioses antiguos fundirse en una nueva fe? ¿O este último refugio de Landvættir acabará sucumbiendo a las llamas de la guerra?#!"
 nh_bookmark_sverker_subheading:0 "El guardián de los espíritus del bosque"
 nh_bookmark_haraldr:0 "Haraldr Cabelloenredado"
 nh_bookmark_haraldr_desc:0 "Noruega es una tierra fragmentada. Innumerables caudillos y pequeños reyes gobiernan sus fiordos, valles y montañas. Las rencillas y las antiguas rivalidades determinan el destino de sus habitantes, y nadie ha logrado aún unir todo el país bajo una sola corona.\n\nPero Haraldr ha pronunciado un juramento formidable. Cuando la orgullosa Gyða rechazó su cortejo y declaró que solo se casaría con un hombre que gobernase toda Noruega, tomó una decisión trascendental: ni tijeras ni peine tocarían su cabello hasta que toda la tierra se sometiese a su autoridad.\n\nDesde entonces lleva el sobrenombre de Cabellera Enmarañada. Lo que para otros quizá sea una fanfarronada insensata es, para Haraldr, un juramento sagrado que pretende cumplir ante los dioses y sus antepasados.\n\nPero los reyes de Noruega no renunciarán a su libertad sin luchar. Batallas sangrientas, alianzas frágiles y traiciones aguardan a cualquiera que ose aspirar al dominio de todo el país.\n\n#bold ¿Cumplirá Haraldr su juramento, unirá Noruega bajo una sola corona y pasará a la historia como Cabellera Hermosa? ¿O su ambición desbocada lo llevará a él y a su linaje a la ruina?#!"
 nh_bookmark_haraldr_subheading:0 "Un rey para Noruega"

