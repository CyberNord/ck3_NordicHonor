l_spanish:
 nh_tenet_vighugr_name:0 "Víghugr"
 nh_tenet_vighugr_desc:0 "El fervor religioso y la disposición al combate animan a quienes consideran la guerra un deber sagrado. Firmes en la fe e intrépidos en la batalla, aspiran a un lugar en Valhöll."
 doctrine_parameter_nh_holy_raid_allowed:0 "Permite guerras de saqueo religioso cuando el rito actual posee Víghugr como principio fundamental."
 doctrine_parameter_nh_forced_conversion_allowed:0 "Permite la conversión forzosa cuando el rito actual posee Víghugr como principio fundamental."
 doctrine_parameter_nh_vighugr_foreign_conversion_bonus:0 "+30 % de velocidad de conversión de condados de religiones no germánicas mediante el consejo del gobernante."
 doctrine_parameter_nh_odins_call_available:0 "Permite la decisión única «Acudir a la llamada de Odín»."
 nh_follow_odins_call_decision:0 "Acudir a la llamada de Odín"
 nh_follow_odins_call_decision_desc:0 "Desde hace días me sigue un cuervo. Dondequiera que descanse, el ave negra se posa cerca. Su mirada me inquieta más de lo que quiero admitir. Incluso durante mis oraciones, mis pensamientos vuelven a él. Por primera vez me pregunto si la fe de mis antepasados es realmente la mía."
 nh_follow_odins_call_decision_tooltip:0 "Seguir el rastro del ave negra."
 nh_follow_odins_call_decision_confirm:0 "Escuchar la llamada"
 nh_follow_odins_call_unavailable:0 "La llamada de Odín no está disponible en estas circunstancias."
 nh_follow_odins_call_blessing_desc:0 "Los nombres de los dioses acuden con facilidad a mis labios. Últimamente, sin embargo, ni la oración apacigua mis pensamientos. Quedan palabras sin decir y decisiones que me oprimen el pecho.\n\nUn cuervo espera al borde del bosque. Al encontrarme con su mirada, pienso en el viejo viajero y en cuanto permanece oculto incluso para mis consejeros."
 nh_odins_call.0001.t:0 "El cuervo en mi ventana"
 nh_odins_call.0001.desc:0 "El cuervo vuelve a estar en mi ventana. Esta vez no lo espanto. Abro el postigo y el aire frío roza mis manos. El ave apenas se mueve. Es como si me hubiera estado esperando.\n\nLas palabras familiares de la oración nocturna titubean en mis labios. Las conozco desde la infancia, pero esta noche no me consuelan. En su lugar regresa el sueño de anoche: un gran salón, voces lejanas y un viajero cuyo rostro queda medio oculto en las sombras.\n\n¿Por qué encuentro en esa visión extraña una paz que me esquiva al rezar?"
 nh_odins_call.0001.convert:0 "Óðinn, escucha mi juramento. Te seguiré."
 nh_odins_call.0001.refuse:0 "¡Jamás me someteré a esos ídolos!"
 nh_odins_call.not_now:0 "Ahora no…"
 nh_odins_call.0002.t:0 "Bajo la mirada del Padre de Todos"
 nh_odins_call.0002.desc:0 "Mis acompañantes guardan silencio al llegar al bosque sagrado. Una sombra negra cruza las ramas; dos cuervos sobrevuelan el santuario. Apoyo la mano en la corteza áspera del viejo árbol.\n\nDurante largo rato no logro hablar. He escuchado demasiadas voces y he dudado demasiado de mi propio juicio. Aquí, bajo las ramas, recuerdo las antiguas historias del viajero.\n\nPor fin inclino la cabeza. Lo que quiero confiar al Padre de Todos apenas me he atrevido a decirlo ante mis compañeros."
 nh_odins_call.0002.bless:0 "Padre de Todos, comparte conmigo tu sabiduría."
 nh_odins_call.0003.t:0 "Un juramento bajo otras estrellas"
 nh_odins_call.0003.desc:0 "Pronuncio mi juramento en la noche fría. Por un instante parece detenerse hasta el viento. Entonces el cuervo despliega sus alas y desaparece entre las estrellas.\n\nLas palabras de mi nueva oración aún me resultan extrañas. Las repito en voz baja hasta que mi voz se afirma. Óðinn. El nombre suena distinto ahora que lo pronuncio sin vacilar.\n\nCuando cierro la ventana, la inquietud no ha desaparecido del todo. Pero sé a quién he prestado juramento."
 nh_odins_call.0003.accept:0 "He pronunciado mi juramento. Los dioses guían mi camino."
 nh_odins_call.0004.t:0 "El don del dios tuerto"
 nh_odins_call.0004.desc:0 "Cuando se apaga el último fuego, una calma desconocida se posa sobre mis pensamientos. Lo que antes parecía enredado comienza a mostrar sus vínculos: un comentario casual, un largo silencio, un consejo descartado con demasiada prisa.\n\nEn el camino de vuelta hablo poco. El viento susurra entre los árboles y, en algún lugar sobre mí, responde un cuervo. Salgo del bosque con las manos vacías. Aun así, siento que llevo algo que no tenía al llegar."
 nh_odins_call.0004.accept:0 "Que la sabiduría me guíe y el honor me sobreviva."
 nh_odins_call.0005.t:0 "Mi fe permanece firme"
 nh_odins_call.0005.desc:0 "Sostengo la mirada del ave negra y pronuncio las palabras familiares de mi fe. Esta vez mi voz no vacila. El cuervo inclina la cabeza y alza el vuelo; sus aleteos se pierden en el crepúsculo.\n\nMe quedo un rato junto a la ventana abierta. Las preguntas de las últimas noches no se han acallado sin más. Pero las he afrontado en lugar de apartarlas.\n\nCuando vuelvo a rezar, comprendo mejor por qué pronuncio esas palabras."
 nh_odins_call.0005.accept:0 "Conozco mi camino."
