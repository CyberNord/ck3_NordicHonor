 # Nordic Honor bookmark
 bm_867_nh_nordic_honor:0 "Nordic Honor"
 bm_867_nh_nordic_honor_desc:0 "게르만 신앙은 기독교 연대기 작가들이 주장하는 것만큼 하나로 뭉쳐 있지 않습니다. 본래 다원적이며 여러 신을 섬기는 게르만 이교는 먼 과거에 뿌리를 두고 있으며, 수많은 형태로 이어져 왔습니다.\n\n대부분의 신도는 아스 신족을 섬기는 신앙인 #bold Æsirtrú#!를 따릅니다. 이들 중 많은 이에게 발할라는 가장 숭고한 목표입니다. 그 영광의 전당은 무엇보다 전장에서 명예롭게 쓰러진 자들에게 문을 열어 줍니다.\n\n사미인의 땅과 맞닿은 북쪽 끝에서는 보다 평화롭고 자연과 가까운 신앙인 #bold Landvættir#!가 발전했습니다. 한편 슬라브인의 땅에서는 슬라브 전통의 영향을 받은 게르만 신앙이 #bold Erþtrú#!라는 이름으로 되살아나고 있습니다.\n\n그러나 힘을 키워 가는 기독교에 맞선 싸움은 가차 없이 이어집니다.\n\n바이킹 군주들은 조상의 신앙을 지켜 낼 수 있을까요? 오랜 전통을 하나의 종교로 결집할까요, 아니면 결국 기독교인의 믿음과 생활 방식을 받아들이게 될까요?\n\n#bold 옛 신들과 새로운 신들이 마지막으로 맞붙는 또 한 번의 라그나로크가 세상을 기다리고 있을까요? 아니면 평화를 지키기 위해 기독교인의 신마저 북방의 신들 사이에서 자리를 얻게 될까요?#!"
 nh_bookmark_ivar:0 "골 없는 이바르"
 nh_bookmark_ivar_desc:0 "라그나르 왕이 죽었습니다!\n\n그는 명예를 빼앗긴 포로처럼 뱀으로 가득한 구덩이에 던져졌습니다. 기독교인들은 그렇게 하면 전장에서의 명예로운 죽음과 발할라의 자리를 빼앗을 수 있으리라 생각했습니다. 하지만 오딘께서는 라그나르와 같은 사내가 헬에 떨어지도록 내버려 두지 않으실 겁니다!\n\n기독교인들은 이 치욕의 대가를 치러야 합니다. 라그나르의 죽음을 복수하기 전까지 평화는 있을 수 없습니다!\n\n잉글랜드 전역이 잿더미로 변하고, 사제들이 신들께 바쳐지며, 그들의 성스러운 경전이 불길에 던져진 뒤에야 우리는 쉴 것입니다.\n\n#bold 자비는 없다! 용서도 없다! 오딘께서 원하신다!#!"
 nh_bookmark_ivar_subheading:0 "북방의 복수자"
 nh_bookmark_dyre:0 "키이우의 뒤레"
 nh_bookmark_dyre_desc:0 "스칸디나비아의 피오르에서 멀리 떨어진 곳에서 뒤레는 스스로 운명을 개척했습니다. 동쪽의 강줄기를 따라 나아간 이 노르드 모험가는 키이우에 이르러 자신만의 영지를 세웠습니다.\n\n이곳에서는 북방의 신들이 슬라브인의 오랜 풍습과 만납니다. 뒤레는 군주에게 날카로운 검과 오딘의 축복만으로는 부족하다는 사실을 압니다. 금과 동맹, 백성의 충성 역시 그만큼 값집니다.\n\n뒤레는 이 낯선 땅에서 약탈품뿐 아니라 미래를 봅니다. 노르드의 뿌리를 잊을 생각은 없지만, 이제 자신의 백성이 된 이들의 풍습과 신들을 외면할 이유가 있을까요?\n\n뒤레는 동방에 노르드 전통을 뿌리내리고 슬라브 풍습과 결합해 새로운 나라를 세울까요? 아니면 수많은 모험가처럼 그의 이름도 역사의 안개 속으로 사라지게 될까요?"
 nh_bookmark_dyre_subheading:0 "이방 땅의 군주"
 nh_bookmark_olafr:0 "백색의 올라프"
 nh_bookmark_olafr_desc:0 "한때 백색의 올라프는 더블린의 노르드인들을 다스렸습니다. 그의 배들은 아일랜드와 스코틀랜드 해안에 전쟁과 공포를 몰고 왔으며, 그 이름은 아일랜드해 너머까지 널리 알려졌습니다.\n\n하지만 명성만으로는 유산을 남길 수 없습니다. 올라프는 옛 터전을 떠나 충성스러운 동료들과 함께 새로운 해안으로 향했습니다. 이제 브르타뉴 해안에서 힘을 모으며, 다시 한번 자신의 운명을 개척할 준비를 하고 있습니다.\n\n세상은 넓습니다. 수평선 너머에는 비옥한 땅과 부유한 도시, 그리고 아직 그의 도래를 두려워하지 않는 군주들의 왕국이 기다리고 있습니다.\n\n#bold 올라프는 조상들의 발자취를 따라 약탈품과 명성에 만족할까요? 아니면 선조들의 풍습과 신들이 대대로 존중받는 새로운 왕국을 세울까요?#!"
 nh_bookmark_olafr_subheading:0 "새로운 해안을 향하여"
 nh_bookmark_rollo:0 "롤로"
 nh_bookmark_rollo_desc:0 "북방의 고향 덴마크에서 롤로는 먼바다의 부름을 느낍니다. 부유한 수도원과 낯선 왕국, 영광스러운 전투에 관한 이야기는 그의 모험심을 자극합니다. 용감하게 손을 뻗는 자에게 바다 너머의 명성과 부가 기다리고 있는데, 굳이 고향에 머물 이유가 있을까요?\n\n특히 프랑크인의 풍요로운 땅은 값진 약탈품을 약속합니다. 그곳의 왕들은 권력과 영향력을 두고 다투며, 왕국의 강과 해안은 노르드 장선에 활짝 열려 있습니다. 충성스러운 전사들을 이끈다면 롤로도 그곳에서 운을 시험하고 이름을 떨칠 수 있을 겁니다.\n\n하지만 바다 너머의 세상에는 금과 은만 있는 것이 아닙니다. 낯선 풍습과 강력한 군주들, 십자가에 못 박힌 신을 향한 믿음은 그가 상상하지 못한 방식으로 운명을 바꿀지도 모릅니다.\n\n#bold 롤로는 두려움의 대상인 바이킹으로서 명성과 부를 거머쥘까요? 오딘의 보호 아래 새로운 고향을 찾을까요? 아니면 언젠가 십자가를 받아들이고, 자신조차 아직 그 의미를 헤아릴 수 없는 유산의 기틀을 세우게 될까요?#!"
 nh_bookmark_rollo_subheading:0 "망치와 십자가 사이"
 nh_bookmark_audr:0 "현명한 아우드"
 nh_bookmark_audr_desc:0 "왕들은 검으로 다툼을 해결하고 전사들은 명성과 부를 좇는 세상에서, 현명한 아우드는 자신만의 길을 걷겠다고 결심했습니다.\n\n북방의 전통과 기독교 세계의 낯선 풍습 사이에서 자란 그녀는 신앙의 힘과 세속 권력의 덧없음을 모두 알고 있습니다. 그러나 옛 신들이 아직 신도들의 운명을 보살피는 동안에도 십자가에 못 박힌 신을 향한 믿음은 거침없이 퍼져 나갑니다.\n\n북대서양 저 멀리에는 불과 얼음이 빚어낸 신비로운 섬이 있습니다. 그곳에서는 땅 자체가 숨을 쉬는 듯합니다. 사람들은 숨겨진 힘과 태고의 정령, 아직 어떤 왕에게도 굴복하지 않은 땅에 관해 이야기합니다. 옛 신들이 신도들에게 새로운 고향을 약속한 곳이 바로 여기일까요?\n\n하지만 백성들의 미래는 아이슬란드의 고립 속이 아니라, 기독교를 받아들이고 서방의 민족들과 평화롭게 살아가는 데 있을지도 모릅니다.\n\n#bold 아우드는 옛 신들의 부름을 따라 그들의 보호 아래 아이슬란드에 새로운 고향을 세울까요? 아니면 십자가를 받아들이고 노르드 동포들을 새로운 시대로 이끌까요?#!"
 nh_bookmark_audr_subheading:0 "불과 얼음의 여군주"
 nh_bookmark_sverker:0 "옹에르만란드의 스베르케르"
 nh_bookmark_sverker_desc:0 "울창한 숲과 깊은 호수, 태고의 성지가 펼쳐진 북쪽 끝에서 Landvættir의 신도들은 대대로 내려온 신앙을 지킵니다. 그들은 수많은 세대에 걸쳐 고향을 보살펴 온 옛 신들과 자연의 정령을 섬깁니다.\n\n하지만 시대가 변하고 있습니다. Æsirtrú를 따르는 강력한 군주들은 자연과 더불어 살아가는 같은 신앙의 형제들을 멸시하고, 이웃의 우코누스코 신도들 역시 이들을 의심의 눈초리로 바라봅니다.\n\n백성들의 미래는 전장이 아니라 신앙 자체에 있을지도 모릅니다. 기독교가 계속 퍼져 나가는 가운데, 그 가르침을 오랜 전통과 결합한다면 평화로운 공존을 향한 새로운 길이 열릴 수 있습니다.\n\n#bold 태고의 정령과 성지를 강력한 이웃의 영향력으로부터 지킬 수 있을까요? 그리스도의 가르침과 옛 신들의 지혜가 하나의 새로운 신앙으로 어우러질 수 있을까요? 아니면 Landvættir의 마지막 피난처마저 끝내 전쟁의 불길에 휩싸이게 될까요?#!"
 nh_bookmark_sverker_subheading:0 "숲 정령들의 수호자"
 nh_bookmark_haraldr:0 "헝클머리 해럴더"
 nh_bookmark_haraldr_desc:0 "노르웨이는 분열된 땅입니다. 수많은 족장과 소왕들이 피오르와 계곡, 산악 지대를 다스립니다. 불화와 오랜 경쟁이 주민들의 운명을 좌우하고, 아직 그 누구도 온 나라를 하나의 왕관 아래 통일하지 못했습니다.\n\n하지만 해럴더는 거대한 맹세를 했습니다. 도도한 기다가 그의 구혼을 거절하며 노르웨이 전역을 다스리는 남자하고만 결혼하겠다고 선언하자, 그는 중대한 결심을 내렸습니다. 온 나라가 자신의 지배 아래 놓이기 전까지는 가위도 빗도 머리카락에 닿지 못하게 하겠다는 것입니다.\n\n그때부터 그는 헝클머리라는 이름으로 불렸습니다. 남들에게는 어리석은 허풍으로 보일지 몰라도, 해럴더에게는 신들과 선조들 앞에서 반드시 지켜야 할 신성한 맹세입니다.\n\n하지만 노르웨이의 왕들은 싸우지도 않고 자유를 내어 주지는 않을 것입니다. 온 나라의 지배권을 노리는 자에게는 피비린내 나는 전투와 불안한 동맹, 배신이 기다리고 있습니다.\n\n#bold 해럴더는 맹세를 지키고 하나의 왕관 아래 노르웨이를 통일하여 미발이라는 이름으로 역사에 남을까요? 아니면 걷잡을 수 없는 야망 때문에 자신과 가문을 파멸로 이끌까요?#!"
 nh_bookmark_haraldr_subheading:0 "노르웨이를 위한 왕"

