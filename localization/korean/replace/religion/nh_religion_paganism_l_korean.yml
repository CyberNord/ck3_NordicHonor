 special_faith_no_special_heritage_name:0 "None"
 special_faith_no_special_heritage_desc: "We walk our own path, claiming neither special kinship nor inherited enmity with the other northern traditions."

 special_faith_christian_heritage_name:0 "Christian Acceptance"
 special_faith_christian_heritage_desc: "A marriage need not silence the old gods. An understanding with our Christian neighbors may join our families while each keeps their faith."

 special_faith_traitor_heritage_name:0 "Siðbrytari"
 special_faith_traitor_heritage_desc: "우리의 신앙적 형제들은 우리가 기독교인들과 어울리고 예수를 우리 신들 가운데 하나로 받아들인다는 이유로 우리를 멸시한다."

