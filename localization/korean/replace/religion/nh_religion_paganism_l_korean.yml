# Honorable Death
 nh_honorable_death_name:0 "명예로운 죽음"
 nh_honorable_death_allowed_name:0 "명예로운 죽음: 허용"
 nh_honorable_death_allowed_desc:0 "전장에서 맞는 명예로운 죽음은 발홀로 향하는 길이다. 기력이 쇠할 때 마지막 결투는 전사의 삶에 걸맞은 끝을 선사한다."
 nh_honorable_death_forbidden_name:0 "명예로운 죽음: 금지"
 nh_honorable_death_forbidden_desc:0 "발홀에 들 자는 오직 오딘만이 정한다. 위대한 전사와 현명한 군주, 학자도 그의 부름을 받을 수 있다. 마지막 결투를 강요하는 것은 오딘의 판단을 모독하는 야만적 행위이다."
