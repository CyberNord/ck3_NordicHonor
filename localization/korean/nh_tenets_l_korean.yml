l_korean:
 nh_tenet_vighugr_name:0 "Víghugr"
 nh_tenet_vighugr_desc:0 "전쟁을 신성한 의무로 여기는 이들은 종교적 열정과 전투 의지로 가득하다. 굳건한 신앙과 두려움 없는 투지로 발회들에 자리를 얻고자 한다."
 doctrine_parameter_nh_holy_raid_allowed:0 "현재 의례가 Víghugr를 핵심 교리로 보유하면 종교적 약탈 전쟁을 허용한다."
 doctrine_parameter_nh_forced_conversion_allowed:0 "현재 의례가 Víghugr를 핵심 교리로 보유하면 강제 개종을 허용한다."
 doctrine_parameter_nh_vighugr_foreign_conversion_bonus:0 "통치자의 평의회를 통한 비게르만 종교 영지의 개종 속도 +30%."
 doctrine_parameter_nh_odins_call_available:0 "일생에 한 번 ‘오딘의 부름을 따르다’ 결단을 사용할 수 있습니다."
 nh_follow_odins_call_decision:0 "오딘의 부름을 따르다"
 nh_follow_odins_call_decision_desc:0 "며칠째 까마귀 한 마리가 나를 따라온다. 어디에서 쉬든 검은 새는 근처에 내려앉는다. 그 눈길은 인정하고 싶은 것보다 더 나를 불안하게 한다. 기도를 올릴 때조차 생각은 새에게로 돌아간다. 처음으로 선조의 신앙이 진정 내 신앙이기도 한지 자문한다."
 nh_follow_odins_call_decision_tooltip:0 "검은 새의 흔적을 따라간다."
 nh_follow_odins_call_decision_confirm:0 "부름에 귀 기울이다"
 nh_follow_odins_call_unavailable:0 "지금의 상황에서는 오딘의 부름에 응할 수 없다."
 nh_follow_odins_call_blessing_desc:0 "신들의 이름은 익숙하게 입술을 떠난다. 하지만 요즘은 기도를 올려도 생각이 가라앉지 않는다. 하지 못한 말들이 남고, 내리지 못한 결정들이 가슴을 누른다.\n\n숲 어귀에 까마귀 한 마리가 앉아 있다. 그 눈을 마주하자 늙은 방랑자와 내 조언자들조차 알지 못하는 것들이 떠오른다."
 nh_odins_call.0001.t:0 "창가의 까마귀"
 nh_odins_call.0001.desc:0 "까마귀가 다시 창가에 앉아 있다. 이번에는 쫓아내지 않는다. 덧문을 열자 찬 공기가 손등을 스친다. 새는 거의 움직이지 않는다. 마치 나를 기다렸다는 듯하다.\n\n익숙한 저녁 기도문이 입술에서 자꾸 끊긴다. 어린 시절부터 알던 말인데도 오늘은 위로가 되지 않는다. 대신 어젯밤 꿈이 되살아난다. 넓은 전당과 먼 목소리들, 얼굴 절반이 그늘에 가린 방랑자가 보인다.\n\n어째서 기도에서 얻지 못한 평온을 이 낯선 모습에서 느끼는 걸까?"
 nh_odins_call.0001.convert:0 "Óðinn, 내 맹세를 들으소서. 당신을 따르겠습니다."
 nh_odins_call.0001.refuse:0 "이 우상들 앞에는 결코 무릎 꿇지 않겠다!"
 nh_odins_call.not_now:0 "지금은 아니다…"
 nh_odins_call.0002.t:0 "만물의 아버지의 시선 아래"
 nh_odins_call.0002.desc:0 "성스러운 숲 어귀에서 일행이 침묵한다. 나뭇가지 사이로 검은 그림자가 움직이고 까마귀 두 마리가 제단 위를 돈다. 오래된 나무의 거친 껍질에 손을 댄다.\n\n한동안 말이 나오지 않는다. 너무 많은 목소리를 들었고, 내 판단을 너무 자주 의심했다. 가지 아래 서 있으니 방랑자의 옛 이야기가 떠오른다.\n\n마침내 고개를 숙인다. 만물의 아버지께 털어놓고 싶은 말은 동료들 앞에서 차마 꺼내지 못했던 것들이다."
 nh_odins_call.0002.bless:0 "만물의 아버지여, 지혜를 나누어 주소서."
 nh_odins_call.0003.t:0 "낯선 별 아래의 맹세"
 nh_odins_call.0003.desc:0 "차가운 밤을 향해 맹세한다. 잠시 바람마저 숨을 죽인 듯하다. 이윽고 까마귀가 날개를 펴고 별들 사이로 사라진다.\n\n새로운 기도의 말은 아직 입에 익지 않는다. 목소리에 힘이 실릴 때까지 조용히 되뇐다. Óðinn. 머뭇거림 없이 부르는 그 이름은 이제 다르게 들린다.\n\n창문을 닫아도 불안이 완전히 가시지는 않는다. 하지만 누구에게 맹세했는지는 안다."
 nh_odins_call.0003.accept:0 "맹세를 마쳤다. 내 길은 신들과 함께한다."
 nh_odins_call.0004.t:0 "외눈박이 신의 선물"
 nh_odins_call.0004.desc:0 "마지막 제물의 불길이 사그라지자 생각에 낯선 평온이 깃든다. 뒤엉켜 있던 일들 사이로 이어짐이 보이기 시작한다. 스쳐 지나간 말과 긴 침묵, 너무 성급히 흘려들었던 조언이 떠오른다.\n\n돌아가는 길에는 말을 아낀다. 나무 사이로 바람이 일고, 머리 위 어딘가에서 까마귀가 답한다. 빈손으로 숲을 나서지만 들어올 때 없던 무언가를 품고 있는 듯하다."
 nh_odins_call.0004.accept:0 "지혜가 나를 이끌고 명예가 오래 남기를."
 nh_odins_call.0005.t:0 "흔들리지 않는 신앙"
 nh_odins_call.0005.desc:0 "검은 새의 눈을 마주하고 익숙한 신앙의 말을 입에 올린다. 이번에는 목소리가 흔들리지 않는다. 까마귀는 고개를 기울이더니 날아오르고, 날갯짓은 땅거미 속으로 사라진다.\n\n열린 창가에 한동안 더 서 있는다. 지난밤들의 의문이 저절로 잠잠해진 것은 아니다. 다만 이제는 밀어내는 대신 똑바로 마주한다.\n\n다시 기도할 때는 내가 왜 그 말을 하는지 더 잘 알 것 같다."
 nh_odins_call.0005.accept:0 "나는 내 길을 안다."
