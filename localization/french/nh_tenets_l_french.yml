l_french:
 nh_tenet_vighugr_name:0 "Víghugr"
 nh_tenet_vighugr_desc:0 "La ferveur religieuse et l'ardeur au combat animent ceux qui considèrent la guerre comme un devoir sacré. Fermes dans leur foi et intrépides au combat, ils aspirent à une place au Valhöll."
 doctrine_parameter_nh_holy_raid_allowed:0 "Permet les guerres de pillage religieux lorsque le rite actuel possède Víghugr comme principe fondamental."
 doctrine_parameter_nh_forced_conversion_allowed:0 "Permet la conversion forcée lorsque le rite actuel possède Víghugr comme principe fondamental."
 doctrine_parameter_nh_elite_warriors_allowed:0 "Permet la décision « $nh_odinstru_raise_elite_warriors$ » lorsque le rite actuel possède Víghugr comme principe fondamental."
 doctrine_parameter_nh_vighugr_foreign_conversion_bonus:0 "+30 % de vitesse de conversion des comtés de religion non germanique par le conseil du dirigeant."
 doctrine_parameter_nh_odins_call_available:0 "Permet la décision unique « Répondre à l'appel d'Odin »."
 nh_follow_odins_call_decision:0 "Répondre à l'appel d'Odin"
 nh_follow_odins_call_decision_desc:0 "Depuis quelques jours, un corbeau me suit. Où que je m'arrête, l'oiseau noir se pose tout près. Son regard me trouble plus que je ne veux l'admettre. Même pendant mes prières, mes pensées reviennent vers lui. Pour la première fois, je me demande si la foi de mes ancêtres est vraiment la mienne."
 nh_follow_odins_call_decision_tooltip:0 "Suivre la trace de l'oiseau noir."
 nh_follow_odins_call_decision_confirm:0 "Écouter l'appel"
 nh_follow_odins_call_unavailable:0 "L'appel d'Odin ne m'est pas accessible dans ces circonstances."
 nh_follow_odins_call_blessing_desc:0 "Les noms des dieux viennent aisément à mes lèvres. Pourtant, ces derniers temps, même la prière n'apaise plus mes pensées. Des mots restent tus, des décisions pèsent sur ma poitrine.\n\nUn corbeau se tient à la lisière du bois. En croisant son regard, je pense au vieux voyageur et à tout ce qui demeure caché, même à mes conseillers."
 nh_odins_call.0001.t:0 "Le corbeau à ma fenêtre"
 nh_odins_call.0001.desc:0 "Le corbeau est encore à ma fenêtre. Cette fois, je ne le chasse pas. J'ouvre le volet et l'air froid effleure mes mains. L'oiseau bouge à peine. On dirait qu'il m'attendait.\n\nLes mots familiers de ma prière du soir hésitent sur mes lèvres. Je les connais depuis l'enfance, mais ce soir ils ne m'apportent aucun réconfort. À leur place revient le rêve de la nuit passée : une vaste salle, des voix lointaines et un voyageur dont le visage reste à demi dans l'ombre.\n\nPourquoi cette vision étrangère m'offre-t-elle une paix qui se dérobe dans la prière ?"
 nh_odins_call.0001.convert:0 "Óðinn, entends mon serment. Je te suivrai."
 nh_odins_call.0001.refuse:0 "Jamais je ne m'inclinerai devant ces idoles !"
 nh_odins_call.not_now:0 "Pas maintenant…"
 nh_odins_call.0002.t:0 "Sous le regard du Père de tous"
 nh_odins_call.0002.desc:0 "À l'orée du bois sacré, mes compagnons se taisent. Une ombre noire glisse entre les branches ; deux corbeaux tournent au-dessus du sanctuaire. Je pose la main sur l'écorce rugueuse du vieil arbre.\n\nLongtemps, aucun mot ne vient. J'ai écouté trop de voix et trop souvent douté de mon propre jugement. Ici, sous les branches, les vieux récits du voyageur me reviennent.\n\nEnfin, j'incline la tête. Ce que je veux confier au Père de tous, j'ai à peine osé le dire devant mes compagnons."
 nh_odins_call.0002.bless:0 "Père de tous, accorde-moi une part de ta sagesse."
 nh_odins_call.0003.t:0 "Un serment sous d'autres étoiles"
 nh_odins_call.0003.desc:0 "Je prononce mon serment dans la nuit froide. Un instant, le vent lui-même semble s'arrêter. Puis le corbeau déploie ses ailes et disparaît parmi les étoiles.\n\nLes mots de ma nouvelle prière me sont encore étrangers. Je les répète doucement jusqu'à ce que ma voix s'affermisse. Óðinn. Ce nom résonne autrement, maintenant que je le prononce sans hésiter.\n\nLorsque je ferme la fenêtre, mon trouble ne s'est pas entièrement dissipé. Mais je sais à qui j'ai prêté serment."
 nh_odins_call.0003.accept:0 "Mon serment est prononcé. Les dieux guideront ma route."
 nh_odins_call.0004.t:0 "Le don du dieu borgne"
 nh_odins_call.0004.desc:0 "Quand le dernier feu s'éteint, un calme inhabituel gagne mes pensées. Ce qui paraissait inextricable laisse entrevoir ses liens : une remarque en passant, un long silence, un conseil écarté trop vite.\n\nSur le chemin du retour, je parle peu. Le vent bruisse entre les arbres et, quelque part au-dessus de moi, un corbeau lui répond. Je quitte le bois les mains vides. Pourtant, j'ai le sentiment d'emporter quelque chose qui me manquait à mon arrivée."
 nh_odins_call.0004.accept:0 "Que la sagesse me guide et que l'honneur me survive."
 nh_odins_call.0005.t:0 "Ma foi demeure"
 nh_odins_call.0005.desc:0 "Je soutiens le regard de l'oiseau noir et prononce les mots familiers de ma foi. Cette fois, ma voix ne tremble pas. Le corbeau incline la tête puis s'envole ; ses battements d'ailes s'effacent dans le crépuscule.\n\nJe reste encore près de la fenêtre ouverte. Les questions des dernières nuits ne se sont pas simplement tues. Mais je leur ai fait face au lieu de les repousser.\n\nQuand je reprends ma prière, je comprends mieux pourquoi je prononce ces mots."
 nh_odins_call.0005.accept:0 "Je connais ma voie."
