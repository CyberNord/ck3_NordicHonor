 nh_rite_forn_sidr_pagan_adherent:0 "Forn Siðrist"
 nh_rite_forn_sidr_pagan_adherent_plural:0 "Forn Siðrists"
 nh_rite_forn_sidr_pagan_desc:0 "Ásatrú honore les Æsir, les Vanes et les coutumes ancestrales du Nord. Offrandes et fêtes unissent la communauté à ses dieux."
 nh_rite_forn_sidr_pagan_old:0 "Vieux Forn Siðr"
 nh_rite_forn_sidr_pagan_old_adj:0 "Vieux Forn Siðr"
 nh_rite_forn_sidr_pagan_old_adherent:0 "Vieux Forn Siðrar"
 nh_rite_forn_sidr_pagan_old_adherent_plural:0 "Vieux Forn Siðrar"
 forn_sidr_pagan_desc:0 "Irminsul réunit les traditions de Forn Siðr et de Wōden Siðr, centrées sur les bosquets sacrés, les ancêtres et les anciens dieux germaniques."
 nh_rite_natturugudtruar_pagan:0 "Náttúruguðtrúar"
 nh_rite_natturugudtruar_pagan_adj:0 "Náttúruguðtrúar"
 nh_rite_natturugudtruar_pagan_adherent:0 "Náttúruguðtrúarmaður"
 nh_rite_natturugudtruar_pagan_adherent_plural:0 "Náttúruguðtrúarmenn"
 nh_rite_natturugudtruar_pagan_desc:0 "L'expression axée sur la nature connue sous le nom de Náttúruguðtrúarmenn, qui s'est mélangée à certains éléments des coutumes finno-ougriennes, incarne un lien profondément enraciné avec le monde naturel et la sorcellerie. Ce système de croyance honore les dieux nordiques et les combine avec les pratiques traditionnelles des peuples finno-ougriens. Grâce à l'application de la sorcellerie et des pratiques chamaniques, les adeptes de cette croyance recherchent la perspicacité spirituelle et l'harmonie avec les forces naturelles. Ils trouvent l'inspiration dans les esprits des forêts, des rivières et des montagnes et célèbrent des rituels pour renforcer leur lien avec la nature. Avec un profond respect pour la diversité de la nature et l'interaction des éléments, ils aspirent à une existence équilibrée et harmonieuse en alignement avec les esprits divins et de la nature."
 nh_rite_natturugudtruar_pagan_old:0 "Vieux Náttúruguðtrúar"
 nh_rite_natturugudtruar_pagan_old_adj:0 "Vieux Náttúruguðtrúar"
 nh_rite_natturugudtruar_pagan_old_adherent:0 "Vieux Náttúruguðtrúarmaður"
 nh_rite_natturugudtruar_pagan_old_adherent_plural:0 "Vieux Náttúruguðtrúarmenn"

# Extinct pre-Christian Gothic rite of Erþtrú; no historical start followers.
 gothic_pagan:0 "Gothique"
 gothic_pagan_adj:0 "gothique"
 gothic_pagan_adherent:0 "païen gothique"
 gothic_pagan_adherent_plural:0 "païens gothiques"
 gothic_pagan_desc:0 "Cette tradition gothique préchrétienne appartient à Erþtrú. Elle unit la fermeté guerrière, les fêtes sacrificielles et la vénération des ancêtres. Les Goths historiques avaient abandonné leurs anciennes croyances bien avant 867 ; ce rite éteint représente une renaissance alternative délibérée."
