 norse_pagan_adherent:0 "fidèle de Æsirtrú"
 norse_pagan_adherent_plural:0 "fidèles de Æsirtrú"
 norse_pagan_desc:0 "Æsirtrú réunit les traditions nordiques d’Ásatrú, de Gíñnregla et d’Óðinnstrú. Ses rites honorent des dieux communs par des pratiques différentes."
 norse_pagan_old:0 "Ancien Æsirtrú"
 norse_pagan_old_adj:0 "Ancien Æsirtrú"
 norse_pagan_old_adherent:0 "fidèle de Ancien Æsirtrú"
 norse_pagan_old_adherent_plural:0 "fidèles de Ancien Æsirtrú"
 nh_rite_heidinn_pagan:0 "Heiðinn"
 nh_rite_heidinn_pagan_adj:0 "heiðinn"
 nh_rite_heidinn_pagan_adherent:0 "Heiðinn"
 nh_rite_heidinn_pagan_adherent_plural:0 "Heiðnir"
 nh_rite_heidinn_pagan_desc:0 "Le panthéon skando-slave de Heiðinn s'est en quelque sorte adapté aux coutumes rudes des peuples slaves. Il vénère les dieux nordiques avec un mélange de traditions nordiques et slaves. Les adeptes de cette croyance apprécient leur lien avec la nature et pratiquent des rituels qui englobent à la fois les éléments sauvages de la mythologie nordique et les cycles naturels des traditions slaves. Ils voient les dieux nordiques comme de puissants protecteurs et recherchent leur faveur en matière de fertilité, de récolte et de survie dans les dures régions slaves. La version kiévienne d'Asatru conserve donc son essence nordique mais intègre des éléments de la culture et des coutumes slaves pour former une communauté de foi unique."
 nh_rite_heidinn_pagan_old:0 "Vieux Heiðinn"
 nh_rite_heidinn_pagan_old_adj:0 "Vieux heiðinn"
 nh_rite_heidinn_pagan_old_adherent:0 "Vieux Heidnir"
 nh_rite_heidinn_pagan_old_adherent_plural:0 "Vieux Heidnir"
