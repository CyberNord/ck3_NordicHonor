 #  Irminsūl (North German) 
 irminsul_pagan:0 "Irminsūl"
 irminsul_pagan_adj:0 "Irminsūl"
 irminsul_pagan_adherent:0 "fidèle de Irminsūl"
 irminsul_pagan_adherent_plural:0 "fidèles de Irminsūl"
  irminsul_pagan_desc: 0 "L'ancien panthéon germanique de Irminsūl se caractérisait par un lien étroit avec la nature et un profond respect pour les éléments naturels. Les païens vénéraient Wotan, le Tout-Père, comme divinité suprême et croyaient en l'existence d'une multitude d'êtres divins qui influençaient le monde qui les entourait. Les païens pratiquaient des rituels et des cérémonies pour établir un lien spirituel avec leurs dieux, offrant des sacrifices et recherchant soutien et bénédiction dans tous les aspects de la vie. Ils croyaient également au destin et entretenaient des liens étroits avec leurs ancêtres. Dans l'ensemble, la foi païenne des Saxons du nord de l'Allemagne se caractérisait par un lien profond avec la nature, un sens aigu de la communauté et une croyance dans le pouvoir et la sagesse de leurs dieux." 
  
