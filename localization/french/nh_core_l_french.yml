 # Nordic Honor bookmark
 bm_867_nh_nordic_honor:0 "Nordic Honor"
 bm_867_nh_nordic_honor_desc:0 "La foi germanique est bien moins unie que ne voudraient le faire croire les chroniqueurs chrétiens. Pluraliste et polythéiste par nature, le paganisme germanique plonge ses racines dans un passé lointain et revêt de nombreuses formes.\n\nLa plupart de ses fidèles suivent #bold Æsirtrú#!, la foi dans les Ases. Pour beaucoup, le Valhalla est le but suprême : une halle de gloire dont les portes s'ouvrent avant tout à ceux qui tombent honorablement au combat.\n\nDans le Grand Nord, aux confins des terres sames, #bold Landvættir#! s'est développé comme un courant plus pacifique, proche de la nature. Dans les terres slaves, en revanche, #bold Erþtrú#! fait revivre une forme de la foi germanique imprégnée de traditions slaves.\n\nMais la lutte contre un christianisme toujours plus puissant est implacable.\n\nLes seigneurs vikings resteront-ils fidèles à la foi de leurs ancêtres ? Feront-ils de leurs anciennes traditions une religion unie, ou finiront-ils par adopter les croyances et le mode de vie des chrétiens ?\n\n#bold Le monde s'achemine-t-il vers un nouveau Ragnarök, un ultime affrontement entre les anciens dieux et les nouveaux ? Ou le Dieu des chrétiens lui-même trouvera-t-il sa place parmi les dieux du Nord, afin de préserver la paix ?#!"
 nh_bookmark_ivar:0 "Ivar le Désossé"
 nh_bookmark_ivar_desc:0 "Le roi Ragnar est mort !\n\nTel un prisonnier déshonoré, il a été jeté dans une fosse pleine de serpents. Les chrétiens croyaient ainsi le priver d'une mort honorable au combat et de sa place au Valhalla. Mais Odin ne laissera pas un homme tel que Ragnar finir en Hel !\n\nLes chrétiens doivent payer cet outrage. Il ne peut y avoir de paix tant que la mort de Ragnar n'aura pas été vengée !\n\nNous ne trouverons le repos que lorsque toute l'Angleterre ne sera plus que cendres, que ses prêtres auront été sacrifiés aux dieux et que ses saintes Écritures auront été livrées aux flammes.\n\n#bold Aucune pitié ! Aucun pardon ! Odin le veut !#!"
 nh_bookmark_ivar_subheading:0 "Vengeur du Nord"
 nh_bookmark_dyre:0 "Dyre de Kiev"
 nh_bookmark_dyre_desc:0 "Loin des fjords de Scandinavie, Dyre a pris son destin en main. En suivant les fleuves de l'Est, cet aventurier nordique est parvenu jusqu'à Kiev, où il s'est taillé son propre domaine.\n\nIci, les dieux du Nord rencontrent les anciennes coutumes des Slaves. Dyre sait qu'un souverain a besoin de bien plus qu'une épée acérée et de la bénédiction d'Odin. L'or, les alliances et la fidélité de ses sujets sont tout aussi précieux.\n\nDans ces terres étrangères, Dyre ne voit pas seulement du butin, mais un avenir. Il n'entend pas oublier ses racines nordiques, mais pourquoi mépriserait-il les coutumes et les dieux de ceux qu'il gouverne désormais ?\n\nDyre affermira-t-il les traditions nordiques à l'Est, les unira-t-il aux coutumes slaves et fondera-t-il un nouveau royaume ? Ou son nom, comme celui de tant d'aventuriers, disparaîtra-t-il dans les brumes de l'histoire ?"
 nh_bookmark_dyre_subheading:0 "Le seigneur des terres étrangères"
 nh_bookmark_olafr:0 "Olafr le Blanc"
 nh_bookmark_olafr_desc:0 "Jadis, Olafr le Blanc régnait sur les hommes du Nord de Dublin. Ses navires semaient la guerre et la terreur sur les côtes d'Irlande et d'Écosse, et son nom était connu bien au-delà de la mer d'Irlande.\n\nMais la gloire seule ne suffit pas à bâtir un héritage. Olafr a quitté son ancienne patrie et pris la mer avec ses fidèles pour gagner de nouveaux rivages. Sur les côtes de Bretagne, il rassemble à présent ses forces, prêt à reprendre son destin en main.\n\nLe monde est vaste et, par-delà l'horizon, l'attendent des terres fertiles, des cités prospères et des royaumes dont les souverains ne redoutent pas encore son arrivée.\n\n#bold Olafr suivra-t-il les traces de ses ancêtres en se contentant de butin et de gloire ? Ou fondera-t-il un nouveau royaume où les coutumes et les dieux de ses aïeux seront honorés pour des générations ?#!"
 nh_bookmark_olafr_subheading:0 "Cap sur de nouveaux rivages"
 nh_bookmark_rollo:0 "Rollon"
 nh_bookmark_rollo_desc:0 "Dans sa patrie danoise, Rollo ressent l'appel du large. Les récits de riches monastères, de royaumes étrangers et de batailles glorieuses éveillent sa soif d'aventure. Pourquoi rester chez lui alors que, de l'autre côté de la mer, la gloire et la fortune attendent ceux qui ont l'audace de les saisir ?\n\nLes riches terres des Francs promettent un butin particulièrement lucratif. Leurs rois se disputent pouvoir et influence, tandis que les fleuves et les côtes de leurs royaumes s'offrent aux drakkars nordiques. À la tête d'une troupe de guerriers fidèles, Rollo pourrait y tenter sa chance et se faire un nom.\n\nMais le monde d'outre-mer recèle bien plus que de l'or et de l'argent. Des coutumes étrangères, de puissants souverains et la foi dans le Dieu crucifié pourraient infléchir son destin d'une manière qu'il ne soupçonne pas.\n\n#bold Rollo gagnera-t-il gloire et richesse en devenant un Viking redouté ? Trouvera-t-il une nouvelle patrie sous la protection d'Odin ? Ou embrassera-t-il un jour la croix pour fonder un héritage dont même lui ne peut encore mesurer la portée ?#!"
 nh_bookmark_rollo_subheading:0 "Entre le marteau et la croix"
 nh_bookmark_audr:0 "Auður la Sagace"
 nh_bookmark_audr_desc:0 "Dans un monde où les rois règlent leurs différends par l'épée et où les guerriers recherchent gloire et fortune, Auður la Sagace est déterminée à suivre sa propre voie.\n\nÉlevée entre les traditions du Nord et les coutumes étrangères du monde chrétien, elle connaît la puissance de la foi autant que le caractère éphémère du pouvoir terrestre. Mais tandis que les anciens dieux veillent encore sur le destin de leurs fidèles, la foi dans le Dieu crucifié se répand inexorablement.\n\nLoin dans l'Atlantique Nord se trouve une île mystérieuse, façonnée par le feu et la glace, où la terre elle-même semble respirer. On parle de puissances cachées, d'esprits ancestraux et de terres qui n'ont jamais été soumises à un roi. Serait-ce là que les anciens dieux promettent un nouveau foyer à leurs fidèles ?\n\nMais peut-être l'avenir de son peuple réside-t-il non dans l'isolement de l'Islande, mais dans l'adoption du christianisme et une coexistence pacifique avec les peuples de l'Ouest.\n\n#bold Auður répondra-t-elle à l'appel des anciens dieux pour fonder en Islande un nouveau foyer sous leur protection ? Ou embrassera-t-elle la croix et guidera-t-elle les siens vers une nouvelle ère ?#!"
 nh_bookmark_audr_subheading:0 "Princesse de feu et de glace"
 nh_bookmark_sverker:0 "Sverker d’Ångermanland"
 nh_bookmark_sverker_desc:0 "Dans le Grand Nord, où des forêts denses, des lacs profonds et d'antiques lieux sacrés façonnent le paysage, les fidèles de Landvættir restent attachés à leur foi ancestrale. Ils vénèrent les anciens dieux et les esprits de la nature qui veillent sur leur patrie depuis d'innombrables générations.\n\nMais les temps changent. Les puissants souverains d'Æsirtrú regardent avec mépris leurs frères dans la foi proches de la nature, tandis que les fidèles voisins d'Ukonusko les considèrent avec tout autant de méfiance.\n\nPeut-être l'avenir de son peuple réside-t-il non sur le champ de bataille, mais dans la foi elle-même. Alors que le christianisme poursuit son expansion, unir ses enseignements aux anciennes traditions pourrait ouvrir une nouvelle voie vers une coexistence pacifique.\n\n#bold Les esprits ancestraux et les lieux sacrés pourront-ils être préservés de l'influence de puissants voisins ? Les enseignements du Christ et la sagesse des anciens dieux pourront-ils former une nouvelle foi ? Ou cet ultime refuge de Landvættir sera-t-il finalement la proie des flammes de la guerre ?#!"
 nh_bookmark_sverker_subheading:0 "Le gardien des esprits de la forêt"
 nh_bookmark_haraldr:0 "Haraldr le Chevelu"
 nh_bookmark_haraldr_desc:0 "La Norvège est une terre morcelée. D'innombrables chefs et petits rois règnent sur ses fjords, ses vallées et ses montagnes. Querelles et anciennes rivalités décident du sort de ses habitants, et nul n'a encore réussi à unir tout le pays sous une seule couronne.\n\nMais Haraldr a prêté un serment formidable. Lorsque la fière Gyða a repoussé ses avances, déclarant qu'elle n'épouserait qu'un homme régnant sur toute la Norvège, il a pris une décision lourde de conséquences : ni ciseaux ni peigne ne toucheront ses cheveux tant que le pays entier ne sera pas soumis à son autorité.\n\nDepuis, il est surnommé le Chevelu. Ce que d'autres jugent être une fanfaronnade insensée est, pour Haraldr, un serment sacré qu'il entend accomplir devant les dieux et ses ancêtres.\n\nMais les rois de Norvège ne renonceront pas à leur liberté sans combattre. Batailles sanglantes, alliances fragiles et trahisons attendent quiconque ose prétendre régner sur tout le pays.\n\n#bold Haraldr accomplira-t-il son serment, unira-t-il la Norvège sous une seule couronne et entrera-t-il dans l'histoire sous le nom de Belle Chevelure ? Ou son ambition sans frein entraînera-t-elle sa perte et celle de sa lignée ?#!"
 nh_bookmark_haraldr_subheading:0 "Un roi pour la Norvège"

