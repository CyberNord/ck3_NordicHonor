 # Nordic Honor bookmark
 bm_867_nh_nordic_honor:0 "Nordic Honor"
 bm_867_nh_nordic_honor_desc:0 "Der germanische Glaube ist weit weniger geeint, als es die christlichen Geschichtsschreiber glauben machen wollen. Das germanische Heidentum, von Natur aus pluralistisch und polytheistisch, reicht weit in die Vergangenheit zurück und kennt zahlreiche Ausprägungen.\n\nDie meisten Anhänger folgen dem #bold Æsirtrú#!, dem Glauben an die Asen. Für viele von ihnen ist Walhall das höchste erstrebenswerte Ziel – eine Ruhmeshalle, deren Tore sich vor allem jenen öffnen, die ehrenhaft im Kampf fallen.\n\nIm hohen Norden, an den Grenzen zu den Gebieten der Samen, entwickelte sich mit #bold Landvættir#! eine friedlichere, naturverbundene Glaubensrichtung. In den slawischen Landen hingegen lebt mit #bold Erþtrú#! eine wiederbelebte, von slawischen Traditionen geprägte Form des germanischen Glaubens.\n\nDoch der Kampf gegen das erstarkende Christentum ist unerbittlich.\n\nWerden die Wikingerfürsten am Glauben ihrer Ahnen festhalten? Werden sie ihre alten Traditionen zu einer geeinten Religion formen oder schließlich den Glauben und die Lebensweise der Christen annehmen?\n\n#bold Steht der Welt ein neues Ragnarök bevor, ein letzter Kampf zwischen den alten und den neuen Göttern? Oder wird selbst der Gott der Christen seinen Platz unter den Göttern des Nordens finden, um den Frieden zu bewahren?#!"
 nh_bookmark_ivar:0 "Ivar der Knochenlose"
 nh_bookmark_ivar_desc:0 "König Ragnar ist tot!\n\nWie ein ehrloser Gefangener wurde er in eine Grube voller Schlangen geworfen. Die Christen glaubten, ihm damit den ehrenvollen Tod im Kampf und seinen Platz in Walhall verwehren zu können. Doch Odin wird nicht zulassen, dass ein Mann wie Ragnar in Hel endet!\n\nFür diese Schandtat müssen die Christen bezahlen. Es kann keinen Frieden geben, solange Ragnars Tod ungesühnt bleibt!\n\nErst wenn ganz England in Schutt und Asche liegt, seine Priester den Göttern geopfert und ihre heiligen Schriften den Flammen übergeben wurden, werden wir ruhen.\n\n#bold Keine Gnade! Keine Vergebung! Odin will es!#!"
 nh_bookmark_ivar_subheading:0 "Rächer des Nordens"
 nh_bookmark_dyre:0 "Dyre von Kiew"
 nh_bookmark_dyre_desc:0 "Weit entfernt von den Fjorden Skandinaviens hat Dyre sein Schicksal selbst in die Hand genommen. Den Flüssen des Ostens folgend, gelangte der nordische Abenteurer bis nach Kiew, wo er sich eine eigene Herrschaft errichtete.\n\nHier treffen die Götter des Nordens auf die alten Bräuche der Slawen. Dyre weiß, dass ein Herrscher mehr benötigt als ein scharfes Schwert und den Segen Odins. Gold, Bündnisse und die Treue seiner Untertanen sind ebenso wertvoll.\n\nIn diesen fremden Landen sieht Dyre nicht nur Beute, sondern eine Zukunft. Seine nordischen Wurzeln will er nicht vergessen, doch warum sollte er die Sitten und Götter jener verschmähen, über die er nun herrscht?\n\nWird Dyre die nordischen Traditionen im Osten festigen, sie mit den Bräuchen der Slawen vereinen und ein neues Reich begründen? Oder wird sein Name wie der so vieler Abenteurer im Nebel der Geschichte verschwinden?"
 nh_bookmark_dyre_subheading:0 "Der Herr der fremden Lande"
 nh_bookmark_olafr:0 "Olafr der Weiße"
 nh_bookmark_olafr_desc:0 "Einst herrschte Olafr der Weiße über die Nordmänner von Dublin. Seine Schiffe brachten Krieg und Schrecken an die Küsten Irlands und Schottlands, und sein Name wurde weit über die Irische See hinaus bekannt.\n\nDoch Ruhm allein schafft kein Vermächtnis. Olafr hat seine bisherige Heimat hinter sich gelassen und ist mit seinen Getreuen zu neuen Ufern aufgebrochen. An der Küste der Bretagne sammelt er nun seine Kräfte, bereit, sein Schicksal ein weiteres Mal selbst in die Hand zu nehmen.\n\nDie Welt ist weit, und jenseits des Horizonts warten fruchtbare Länder, reiche Städte und Königreiche, deren Herrscher seine Ankunft noch nicht fürchten.\n\n#bold Wird Olafr in die Fußstapfen seiner Vorfahren treten und sich mit Beute und Ruhm begnügen? Oder wird er ein neues Königreich errichten, in dem die Sitten und Götter seiner Ahnen noch über Generationen hinweg verehrt werden?#!"
 nh_bookmark_olafr_subheading:0 "Aufbruch zu neuen Ufern"
 nh_bookmark_rollo:0 "Rollo"
 nh_bookmark_rollo_desc:0 "In seiner nordischen Heimat Dänemark verspürt Rollo den Ruf der Ferne. Die Geschichten von reichen Klöstern, fremden Königreichen und ruhmreichen Schlachten wecken seine Abenteuerlust. Warum sollte er in der Heimat verweilen, wenn jenseits des Meeres Ruhm und Reichtum auf jene warten, die mutig genug sind, danach zu greifen?\n\nBesonders die reichen Länder der Franken versprechen lohnende Beute. Ihre Könige streiten um Macht und Einfluss, während die Flüsse und Küsten ihrer Reiche den nordischen Langschiffen offenstehen. Mit einer treuen Schar von Kriegern könnte Rollo dort sein Glück versuchen und sich einen Namen machen.\n\nDoch die Welt jenseits des Meeres birgt mehr als Gold und Silber. Fremde Sitten, mächtige Herrscher und der Glaube an den gekreuzigten Gott könnten sein Schicksal auf ungeahnte Weise verändern.\n\n#bold Wird Rollo als gefürchteter Wikinger Ruhm und Reichtum erlangen? Wird er unter Odins Schutz eine neue Heimat finden? Oder wird er eines Tages das Kreuz annehmen und ein Vermächtnis begründen, dessen Bedeutung selbst er noch nicht erahnen kann?#!"
 nh_bookmark_rollo_subheading:0 "Zwischen Hammer und Kreuz"
 nh_bookmark_audr:0 "Auður djúpúðga"
 nh_bookmark_audr_desc:0 "In einer Welt, in der Könige ihre Streitigkeiten mit dem Schwert austragen und Krieger nach Ruhm und Reichtum streben, ist Auður die Tiefsinnige entschlossen, ihren eigenen Weg zu gehen.\n\nAufgewachsen zwischen den Traditionen des Nordens und den fremden Bräuchen der christlichen Welt, kennt sie die Macht des Glaubens ebenso wie die Vergänglichkeit weltlicher Herrschaft. Doch während die alten Götter noch über das Schicksal ihrer Anhänger wachen, breitet sich der Glaube an den gekreuzigten Gott unaufhaltsam aus.\n\nFern im Nordatlantik liegt eine geheimnisvolle Insel, von Feuer und Eis geformt, wo die Erde selbst zu atmen scheint. Man erzählt sich von verborgenen Mächten, uralten Geistern und Ländern, die noch keinem König untertan sind. Könnte dies jener Ort sein, an dem die alten Götter ihren Anhängern eine neue Heimat versprechen?\n\nDoch vielleicht liegt die Zukunft ihres Volkes nicht in der Abgeschiedenheit Islands, sondern in der Annahme des Christentums und einem friedlichen Zusammenleben mit den Völkern des Westens.\n\n#bold Wird Auður dem Ruf der alten Götter folgen und auf Island eine neue Heimat unter ihrem Schutz begründen? Oder wird sie das Kreuz annehmen und ihre nordischen Landsleute in ein neues Zeitalter führen?#!"
 nh_bookmark_audr_subheading:0 "Fürstin von Feuer und Eis"
 nh_bookmark_sverker:0 "Sverker von Ångermanland"
 nh_bookmark_sverker_desc:0 "Im hohen Norden, wo dichte Wälder, tiefe Seen und uralte heilige Stätten das Land prägen, halten die Anhänger der Landvættir an ihrem überlieferten Glauben fest. Sie verehren die alten Götter und die Geister der Natur, die seit unzähligen Generationen über ihre Heimat wachen.\n\nDoch die Zeiten ändern sich. Die mächtigen Herrscher des Æsirtrú betrachten ihre naturverbundenen Glaubensbrüder mit Geringschätzung, während die benachbarten Anhänger des Ukonusko ihnen ebenfalls mit Misstrauen begegnen.\n\nVielleicht liegt die Zukunft seines Volkes nicht auf dem Schlachtfeld, sondern im Glauben selbst. Während sich das Christentum immer weiter ausbreitet, könnte eine Verbindung seiner Lehren mit den alten Traditionen einen neuen Weg des friedlichen Zusammenlebens eröffnen.\n\n#bold Wird es gelingen, die alten Geister und heiligen Stätten vor dem Einfluss mächtiger Nachbarn zu bewahren? Können die Lehren Christi und die Weisheit der alten Götter zu einem neuen Glauben vereint werden? Oder wird diese letzte Zuflucht der Landvættir schließlich den Flammen des Krieges zum Opfer fallen?#!"
 nh_bookmark_sverker_subheading:0 "Der Hüter der Waldgeister"
 nh_bookmark_haraldr:0 "Haraldr Struwwelhaar"
 nh_bookmark_haraldr_desc:0 "Norwegen ist ein zersplittertes Land. Unzählige Häuptlinge und Kleinkönige herrschen über seine Fjorde, Täler und Berge. Fehden und alte Rivalitäten bestimmen das Schicksal seiner Bewohner, und noch ist es niemandem gelungen, das gesamte Land unter einer einzigen Krone zu vereinen.\n\nDoch Haraldr hat einen gewaltigen Schwur geleistet. Als die stolze Gyða seine Werbung zurückwies und erklärte, sie werde nur einen Mann heiraten, der über ganz Norwegen herrsche, fasste er einen folgenschweren Entschluss: Weder Schere noch Kamm sollen sein Haar berühren, bis das ganze Land seiner Herrschaft unterworfen ist.\n\nSeither trägt er den Namen Struwwelhaar. Was für andere eine törichte Prahlerei sein mag, ist für Haraldr ein heiliger Schwur, den er vor den Göttern und seinen Ahnen zu erfüllen gedenkt.\n\nDoch Norwegens Könige werden ihre Freiheit nicht kampflos aufgeben. Blutige Schlachten, zerbrechliche Bündnisse und Verrat erwarten jeden, der es wagt, nach der Herrschaft über das gesamte Land zu greifen.\n\n#bold Wird Haraldr seinen Schwur erfüllen, Norwegen unter einer Krone vereinen und als Schönhaar in die Geschichte eingehen? Oder wird sein ungebändigter Ehrgeiz ihn und sein Geschlecht ins Verderben führen?#!"
 nh_bookmark_haraldr_subheading:0 "Ein König für Norwegen"

