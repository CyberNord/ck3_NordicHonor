 forn_sidr_pagan_adherent_plural:0 "Irminsul-Gläubige"
 forn_sidr_pagan_desc:0 "Irminsul vereint die Überlieferungen von Forn Siðr und Wōden Siðr. Heilige Haine, Vorfahren und die alten germanischen Götter stehen im Mittelpunkt."
 
