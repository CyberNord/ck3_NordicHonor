 special_faith_no_special_heritage_name: "Kein besonderes Erbe"
 special_faith_no_special_heritage_desc: "Wir gehen unseren eigenen Weg und beanspruchen weder besondere Verbundenheit noch ererbte Feindschaft gegenüber den anderen nordischen Überlieferungen."

 special_faith_christian_heritage_name: "Christliche Duldung"
 special_faith_christian_heritage_desc: "Eine Ehe muss die alten Götter nicht zum Schweigen bringen. Eine Übereinkunft mit unseren christlichen Nachbarn kann unsere Familien verbinden, während jeder seinen Glauben bewahrt."

 special_faith_traitor_heritage_name:0 "Siðbrytari"
 special_faith_traitor_heritage_desc: "Unsere eigenen Glaubensbrüder verachten uns, weil wir Gemeinschaft mit Christen pflegen und Jesus als einen Gott unter unseren Göttern anerkennen."

# Forn Siðr (North German)
 forn_sidr_pagan:0 "Irminsul"
 forn_sidr_pagan_adj:0 "Irminsul"
