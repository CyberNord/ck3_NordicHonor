# Heritages
 has_special_heritage_name: "Nordisches Erbe"
 special_faith_has_germanic_heritage_name: "Nordisches Erbe"
 special_faith_has_germanic_heritage_desc: "Auch wenn unsere Riten verschieden sind, erkennen wir dieselben Götter an und ehren das gemeinsame Erbe unserer Ahnen."
 
 special_faith_stadfast_heritage_name:0 "Staðfast"
 special_faith_stadfast_heritage_desc: "Wir allein bewahren die unverfälschten Lehren unserer Ahnen. Andere Glaubensbrüder sind weich geworden und folgen einem falschen Ideal."
