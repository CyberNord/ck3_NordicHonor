# Wōden Siðr
 woden_sidr_pagan:0 "Wōden Siðr"
 woden_sidr_pagan_adj:0 "Wōden Siðr"
 woden_sidr_pagan_adherent:0 "Anhänger von Wōden Siðr"
 woden_sidr_pagan_adherent_plural:0 "Anhänger von Wōden Siðr"
