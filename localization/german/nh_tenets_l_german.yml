l_german:
 nh_tenet_vighugr_name:0 "Víghugr"
 nh_tenet_vighugr_desc:0 "Religiöser Eifer und Kampfbereitschaft erfüllen jene, die Krieg als heilige Pflicht begreifen. Standhaft im Glauben und furchtlos im Kampf streben sie nach einem Platz in Valhöll."
 doctrine_parameter_nh_holy_raid_allowed:0 "Erlaubt religiöse Plünderungskriege, wenn der aktuelle Ritus Víghugr als Kern-Grundsatz besitzt."
 doctrine_parameter_nh_forced_conversion_allowed:0 "Erlaubt die Zwangsbekehrung, wenn der aktuelle Ritus Víghugr als Kern-Grundsatz besitzt."
 doctrine_parameter_nh_vighugr_foreign_conversion_bonus:0 "+30 % Bekehrungsgeschwindigkeit für Grafschaften nichtgermanischer Religionen durch den Rat des Herrschers."
 doctrine_parameter_nh_odins_call_available:0 "Ermöglicht die einmalige Entscheidung „Odins Ruf folgen“."
 nh_follow_odins_call_decision:0 "Odins Ruf folgen"
 nh_follow_odins_call_decision_desc:0 "Seit einigen Tagen folgt mir ein Rabe. Wo immer ich raste, lässt sich der schwarze Vogel in meiner Nähe nieder. Sein Blick beunruhigt mich mehr, als ich zugeben möchte. Selbst während meiner Gebete schweifen meine Gedanken zu ihm zurück. Zum ersten Mal frage ich mich, ob der Glaube meiner Väter wirklich auch der meine ist."
 nh_follow_odins_call_decision_tooltip:0 "Den Spuren des schwarzen Vogels folgen."
 nh_follow_odins_call_decision_confirm:0 "Dem Ruf lauschen"
 nh_follow_odins_call_unavailable:0 "Odins Ruf steht mir unter diesen Umständen nicht offen."
 nh_follow_odins_call_blessing_desc:0 "Die Namen der Götter gehen mir leicht über die Lippen. Doch in letzter Zeit finden meine Gedanken auch im Gebet keine Ruhe. Manches bleibt ungesagt, und manche Entscheidung liegt mir schwer auf der Brust.\n\nAm Waldrand sitzt ein Rabe. Während ich seinem Blick begegne, denke ich an den alten Wanderer und an all das, was selbst meinen Ratgebern verborgen bleibt."
 nh_odins_call.0001.t:0 "Der Rabe vor meinem Fenster"
 nh_odins_call.0001.desc:0 "Wieder sitzt der Rabe vor meinem Fenster. Diesmal scheuche ich ihn nicht fort. Ich öffne den Laden, und kalte Luft streicht über meine Hände. Der Vogel rührt sich kaum. Es ist, als hätte er auf mich gewartet.\n\nDie vertrauten Worte meines Abendgebets kommen mir stockend über die Lippen. Ich kenne sie seit meiner Kindheit, doch heute tragen sie mich nicht. Stattdessen kehrt der Traum der letzten Nacht zurück: eine weite Halle, der Klang ferner Stimmen und die Gestalt eines Wanderers, dessen Gesicht halb im Schatten liegt.\n\nWarum finde ich ausgerechnet in diesem fremden Bild eine Ruhe, die mir im Gebet fehlt?"
 nh_odins_call.0001.convert:0 "Óðinn, höre meinen Eid. Ich werde dir folgen."
 nh_odins_call.0001.refuse:0 "Niemals unterwerfe ich mich diesen Götzen!"
 nh_odins_call.not_now:0 "Nicht jetzt …"
 nh_odins_call.0002.t:0 "Unter den Augen des Allvaters"
 nh_odins_call.0002.desc:0 "Am Rand des Hains verstummen die Stimmen meiner Begleiter. Zwischen den Ästen bewegt sich ein schwarzer Schatten; zwei Raben kreisen über der Opferstätte. Ich lege meine Hand auf die raue Rinde des alten Baumes.\n\nLange bringe ich kein Wort hervor. Zu viele Stimmen habe ich gehört, zu oft meinen eigenen Urteilsspruch hinterfragt. Hier, unter den Zweigen, kommen mir die alten Geschichten vom Wanderer wieder in den Sinn.\n\nSchließlich neige ich den Kopf. Was ich dem Allvater anvertrauen will, habe ich vor meinen Gefährten kaum auszusprechen gewagt."
 nh_odins_call.0002.bless:0 "Allvater, schenke mir einen Teil deiner Weisheit."
 nh_odins_call.0003.t:0 "Ein Eid unter fremden Sternen"
 nh_odins_call.0003.desc:0 "Ich spreche meinen Eid in die kalte Nacht. Für einen Augenblick scheint selbst der Wind innezuhalten. Dann schlägt der Rabe seine Flügel auf und verschwindet zwischen den Sternen.\n\nDie Worte meines neuen Gebets sind mir noch ungewohnt. Ich wiederhole sie leise, bis meine Stimme fester wird. Óðinn. Der Name klingt nun anders, seit ich ihn ohne Zögern ausspreche.\n\nAls ich das Fenster schließe, ist die Unruhe nicht ganz verschwunden. Aber ich weiß, wem mein Eid gilt."
 nh_odins_call.0003.accept:0 "Mein Eid ist gesprochen. Mein Weg gehört den Göttern."
 nh_odins_call.0004.t:0 "Die Gabe des Einäugigen"
 nh_odins_call.0004.desc:0 "Als das letzte Opferfeuer erlischt, legt sich eine seltsame Ruhe über meine Gedanken. Was zuvor wie ein unentwirrbares Geflecht wirkte, zeigt plötzlich Muster: ein beiläufiges Wort, ein langes Schweigen, ein Rat, den ich allzu rasch verworfen hatte.\n\nAuf dem Rückweg spreche ich wenig. Zwischen den Bäumen rauscht der Wind, und hoch über mir antwortet ein Rabe. Ich verlasse den Hain mit leeren Händen. Dennoch ist mir, als trüge ich etwas bei mir, das ich beim Kommen noch nicht besessen habe."
 nh_odins_call.0004.accept:0 "Weisheit sei mein Rat, Ehre mein Vermächtnis."
 nh_odins_call.0005.t:0 "Mein Glaube steht fest"
 nh_odins_call.0005.desc:0 "Ich begegne dem Blick des schwarzen Vogels und spreche die vertrauten Worte meines Glaubens. Diesmal stockt meine Stimme nicht. Der Rabe legt den Kopf schief; dann hebt er ab, und sein Flügelschlag verliert sich in der Dämmerung.\n\nIch bleibe noch eine Weile am offenen Fenster stehen. Die Fragen der vergangenen Nächte sind nicht einfach verstummt. Doch ich habe ihnen standgehalten, statt sie nur von mir zu schieben.\n\nAls ich mich wieder meinem Gebet zuwende, weiß ich besser, weshalb ich diese Worte spreche."
 nh_odins_call.0005.accept:0 "Ich kenne meinen Weg."
